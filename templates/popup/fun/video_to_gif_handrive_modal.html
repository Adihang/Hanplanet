<div class="media-tool-modal-backdrop site-modal-backdrop" data-media-handrive-picker-modal hidden>
    <section class="media-tool-modal media-handrive-picker-modal site-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="videoToGifHandriveTitle">
        <header class="media-tool-modal-head site-modal-head">
            <h2 class="media-tool-modal-title" id="videoToGifHandriveTitle">{{ handrive_modal_title }}</h2>
            {% include "popup/handrive/_popup_close_button.html" with close_label=handrive_close_label media_handrive_picker_close=True %}
        </header>
        <div class="media-handrive-picker-list-wrap">
            <ul class="media-handrive-picker-list" data-media-handrive-picker-list role="list" aria-label="{{ handrive_modal_title }}"></ul>
        </div>
        <p class="media-handrive-picker-status" data-media-handrive-picker-status role="status" aria-live="polite"></p>
    </section>
</div>
