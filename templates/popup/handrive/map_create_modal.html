<div id="handrive-map-create-modal" class="handrive-popup-modal" hidden>
    <div class="handrive-popup-modal-backdrop" id="handrive-map-create-modal-backdrop"></div>
    <div class="handrive-popup-modal-dialog" data-popup-fit-bottom role="dialog" aria-modal="true" aria-labelledby="handrive-map-create-title">
        <header class="handrive-popup-head">
            <h2 id="handrive-map-create-title" class="handrive-popup-title">{{ handrive_text.map_create_title }}</h2>
            {% include "popup/handrive/_popup_close_button.html" with click_target_id="handrive-map-create-cancel-btn" %}
        </header>
        <div class="handrive-popup-target" id="handrive-map-create-target"></div>
        <label class="handrive-field handrive-field-full">
            <span>{{ handrive_text.map_create_name_label }}</span>
            <input type="text" id="handrive-map-create-input" placeholder="{{ handrive_text.map_create_placeholder }}" autocomplete="off" spellcheck="false">
        </label>
        <div class="handrive-popup-actions" style="padding-top:12px;">
            <button type="button" class="ui-btn" id="handrive-map-create-cancel-btn">{{ handrive_text.cancel }}</button>
            <button type="button" class="ui-btn ui-btn-primary" id="handrive-map-create-confirm-btn">{{ handrive_text.map_create_confirm }}</button>
        </div>
    </div>
</div>
