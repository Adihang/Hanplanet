map $http_x_forwarded_proto $upstream_x_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

map "" $django_upstream {
    default django:8000;
}

map "" $gitea_upstream {
    default gitea:3000;
}

map "" $game_upstream {
    default bumpercar-spiky-server:8080;
}

map "" $map_collab_upstream {
    default map-collab-server:8083;
}

map "" $wargame_upstream {
    default wargame:8090;
}

log_format access_json escape=json '{'
    '"logged_at":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"client_ip":"$client_ip",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"query":"$args",'
    '"status":$status,'
    '"request_time_s":$request_time,'
    '"upstream_time_s":"$upstream_response_time",'
    '"bytes_sent":$body_bytes_sent,'
    '"host":"$host",'
    '"scheme":"$scheme",'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer"'
'}';

server {
    listen 80 default_server;
    server_name _ hanplanet.com www.hanplanet.com localhost;

    client_max_body_size 100m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    access_log /var/log/nginx/access_json.log access_json;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, s-maxage=2592000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=2592000, immutable" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /media/ {
        alias /data/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /ai/ {
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_x_forwarded_proto;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_x_forwarded_proto;
    }
}

