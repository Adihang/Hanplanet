<form
    method="post"
    {% if handrive_password_change_action_url %}action="{{ handrive_password_change_action_url }}"{% endif %}
    class="auth-form site-loading-host"
    id="handrive-password-change-required-form"
    {% if site_auth_is_modal %}
    data-auth-form
    data-auth-generic-error="오류가 발생했습니다. 다시 시도해주세요."
    {% endif %}
>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ handrive_password_change_next }}">

    {% if handrive_password_change_error_message or handrive_password_change_form.non_field_errors %}
        <div class="auth-error">{{ handrive_password_change_error_message|default:handrive_text.auth_password_change_error }}</div>
    {% endif %}

    <p class="ui-subtitle auth-password-change-hint">{{ handrive_text.auth_password_change_hint }}</p>

    <label class="auth-field auth-field-full">
        <span>{{ handrive_text.auth_new_password_label }}</span>
        <input
            type="password"
            name="password1"
            autocomplete="new-password"
            data-handrive-auth-safe-input="password"
            pattern="{{ handrive_auth_safe_input_pattern }}"
            data-handrive-auth-safe-message="{{ handrive_text.auth_password_forbidden_chars }}"
            required
            autofocus
        >
    </label>

    <label class="auth-field auth-field-full">
        <span>{{ handrive_text.auth_new_password_confirm_label }}</span>
        <input
            type="password"
            name="password2"
            autocomplete="new-password"
            data-handrive-auth-safe-input="password"
            pattern="{{ handrive_auth_safe_input_pattern }}"
            data-handrive-auth-safe-message="{{ handrive_text.auth_password_forbidden_chars }}"
            required
        >
    </label>

    <div class="auth-actions">
        <button class="ui-btn ui-btn-primary" type="submit">{{ handrive_text.auth_password_change_submit }}</button>
    </div>
</form>
