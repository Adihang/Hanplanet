{% extends 'base.html' %}
{% load static_versioned %}
{% block body_class %}ui-page onscripter-player-page{% endblock %}
{% block extra_head %}
        <meta onsyuri_js="{{ engine_js_url }}">
        <meta onsyuri_wasm="{{ engine_wasm_url }}">
        <meta onsyuri_index="{{ index_url }}">
{% endblock %}
{% block content %}
        <main class="onscripter-player-main">
            <section class="onscripter-stage" aria-label="{{ page_title }}">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
        <video id="video" onended="videoEnded()"></video>
        <div id="onscripter_audio_panel" aria-label="Audio controls" data-muted="false">
            <button id="onscripter_audio_mute" type="button" aria-label="Mute audio" aria-pressed="false">
                <svg class="onscripter-audio-icon onscripter-audio-icon-volume" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 5 6 9H2v6h4l5 4V5Z"></path>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
                <svg class="onscripter-audio-icon onscripter-audio-icon-muted" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M11 5 6 9H2v6h4l5 4V5Z"></path>
                    <path d="m22 9-6 6"></path>
                    <path d="m16 9 6 6"></path>
                </svg>
            </button>
            <input id="onscripter_audio_volume" type="range" min="0" max="100" step="1" value="80" aria-label="Volume">
        </div>
        <script type="text/javascript"> // browser universe function
            function scale_full(docobj, ratio=0) {
                var host = docobj.closest(".onscripter-stage") || docobj.parentElement;
                var hostRect = host ? host.getBoundingClientRect() : null;
                var w = hostRect && hostRect.width ? hostRect.width : window.innerWidth;
                var h = hostRect && hostRect.height ? hostRect.height : window.innerHeight;
                if(ratio>0) {
                    if(w/h > ratio) {
                        docobj.style.width  = h * ratio  + "px";
                        docobj.style.height = h + "px";
                    }
                    else {
                        docobj.style.width  = w  + "px";
                        docobj.style.height = w / ratio + "px";
                    }
                }
                else {
                    docobj.style.width  = w + "px";
                    docobj.style.height = h + "px";
                }
                return {w: docobj.style.width, h: docobj.style.height}
            }
            
            async function delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async function send_worker(worker, data) {
                worker.postMessage(data);
                return new Promise((res)=>{
                    worker.onmessage = (event)=>{
                        res(event.data);
                    };
                })
            };

            async function load_json(url) {
                return new Promise((res)=>{
                    fetch(url).then((res)=>res.json())
                    .then((json)=>(res(json)));
                })
            }

            async function load_js(url) {
                var script = document.createElement('script');
                script.type = "text/javascript";
                script.src = url;
                document.getElementsByTagName("body")[0].appendChild(script);
                return new Promise((res)=>{
                    script.onload = () =>{
                        res(1);
                    }
                })
            }

            async function download_data (name, data) {
                var blob = new Blob([data], {type:'application/octet-stream'});
                var e = document.createEvent('MouseEvents');
                var a = document.createElement('a');
                a.download = name;
                a.href = window.URL.createObjectURL(blob);
                a.dataset.downloadurl = ['application/octet-stream', a.download, a.href].join(':');
                e.initMouseEvent('click', true, false, window, 0, 0, 0, 0, 0, false, false, false, false, 0, null);
                a.dispatchEvent(e);
            }

            async function upload_data() {
                return new Promise((res, rej) => {
                    var i = document.createElement('input');
                    i.type = 'file';
                    i.addEventListener('change', () => {
                        var file = i.files[0];
                        var reader = new FileReader();
                        reader.onload = (e) => {
                            return res(e.target.result)
                        };
                        reader.readAsArrayBuffer(file);
                    });
                    i.click(); //can not open without user click
                });
            }

            function get_cookie(name) {
                var cookie = document.cookie.split(";").find((item) => item.trim().startsWith(name + "="));
                if(!cookie) return "";
                return decodeURIComponent(cookie.split("=").slice(1).join("="));
            }

            const ONSYURI_DEBUG_ENABLED = new URLSearchParams(window.location.search).has("debug");
            function onsyuri_debug(level, args) {
                if(!ONSYURI_DEBUG_ENABLED) return;
                var line = `[${new Date().toISOString()}] ${level} ` + Array.from(args).map((arg) => {
                    if(arg instanceof Error) return arg.stack || arg.message;
                    if(typeof arg === "string") return arg;
                    try { return JSON.stringify(arg); }
                    catch { return String(arg); }
                }).join(" ");
                window.__onsyuri_debug_lines = window.__onsyuri_debug_lines || [];
                window.__onsyuri_debug_lines.push(line);
                var node = document.getElementById("onsyuri_debug_log");
                if(node) node.textContent = window.__onsyuri_debug_lines.slice(-300).join("\n");
            }
            if(ONSYURI_DEBUG_ENABLED) {
                ["log", "warn", "error"].forEach((level) => {
                    var original = console[level].bind(console);
                    console[level] = function() {
                        onsyuri_debug(level, arguments);
                        original.apply(console, arguments);
                    };
                });
                window.addEventListener("error", (event) => {
                    onsyuri_debug("window.error", [event.message, event.filename, event.lineno, event.error]);
                });
                window.addEventListener("unhandledrejection", (event) => {
                    onsyuri_debug("unhandledrejection", [event.reason]);
                });
            }
        </script>
        
        <script type="text/javascript" src="{{ jszip_url }}"></script>
        <script type="text/javascript"> // onsyuri web function 
            function em_mkdirs(_FS, path) {
                var tmpdir="";
                var arr = path.split('/');
                for(i in arr)
                {
                    tmpdir += arr[i] +"/";
                    if(arr[i]=="") continue;
                    try{
                        _FS.mkdir(tmpdir);
                    }
                    catch{};
                }
            }

            function em_lsfiles(_FS, top) {
                var files = [];
                var paths = _FS.readdir(top);
                for(let i=0; i < paths.length; i++) {
                    paths[i] = top + "/" + paths[i];
                }
                while(paths.length > 0) {
                    path = paths.pop();
                    if(path.endsWith(".") || path.endsWith("..")) continue;
                    const stat = _FS.stat(path);
                    if (_FS.isDir(stat.mode)) {
                        let tmppaths = _FS.readdir(path);
                        for (let i=0; i<tmppaths.length; i++) {
                            paths.push(path + "/" + tmppaths[i]);
                        }
                    }
                    else if (_FS.isFile(stat.mode)) {
                        files.push(path);   
                    }
                    else if (_FS.isLink(stat.mode)) {
                        // not consider symbol link here
                    }
                }
                return files;
            }

            async function em_export_data(_FS, paths) {
                var zip = new JSZip();
                for (let i=0; i<paths.length; i++) {
                    var data = _FS.readFile(paths[i]);
                    zip.file(paths[i], data, {binary: true});
                    console.log("## onsyuri_fs: em_export", paths[i]);
                }
                return await zip.generateAsync({type : "arraybuffer"});
            }

            function em_export(_FS, paths, name="export.zip") {
                em_export_data(_FS, paths).then((data) => download_data(name, data));
            }

            async function em_import(_FS, data) {
                var zip = await JSZip.loadAsync(data);
                var writes = [];
                zip.forEach((path, obj) => {
                    if(obj.dir) {
                        em_mkdirs(_FS, path);
                    }
                    else {
                        writes.push(obj.async("arraybuffer").then((buf) => {
                            em_mkdirs(_FS, path.substring(0, path.lastIndexOf("/") + 1));
                            _FS.writeFile(path, new Uint8Array(buf));
                            console.log("## onsyuri_fs: em_import", path);
                        }));
                    }
                });
                await Promise.all(writes);
            }

            // mount --gamedir other by preload or lazyload
            function mount_game(_FS, gamedir, files, urlbase="", lazyload=false) {
                console.log("## onsyuri_fs: mount_onsgame", gamedir);
                var filemap = {}
                
                if(gamedir[gamedir.length-1] =="/" ) 
                    gamedir=gamedir.substring(0, gamedir.length-1);

                if(urlbase[urlbase.length-1] == "/")
                    urlbase=urlbase.substring(0, urlbase.length-1);

                for(i in files) {
                    var path = files[i].path;
                    var url = files[i].url;
                    var file_lazyload = files[i].lazyload;
                    var j = path.lastIndexOf("/");
                    var filename =path.substring(j+1);
                    var filedir = path.substring(0, j);
                    var basedir = gamedir + "/" + filedir;
                    if(basedir[basedir.length-1]!="/") basedir+="/";
                    if(url==undefined || url.length==0)
                    {
                        if (path[0]=="/") url = urlbase + path;
                        else url = urlbase + "/" + path;
                    }

                    // console.log(path, url, file_lazyload);
                    em_mkdirs(_FS, basedir);
                    if(file_lazyload==undefined) file_lazyload = lazyload;
                    if(file_lazyload){ // pay attension to the case sensitive!
                        var key = basedir + filename;
                        filemap[key.toLowerCase()] = {
                            url: url,
                            loaded: false,
                            mountedPath: key
                        };
                    }
                    else {
                        _FS.createPreloadedFile(basedir, filename, url, true, false);
                    }
                }
                return filemap;
            }

            // mount --gamedir using BrowserFS with lazyload, 
            // deprecated as sync block sound problems
            function mount_game2(_module, gamedir, lazyindex, urlbase) {
                console.log("## onsyuri_fs: mount_onsgame2", gamedir);
                var _FS=_module.FS;
                _module.addRunDependency("onsgamefs");
                
                var brewfs =  new BrowserFS.FileSystem.MountableFileSystem();
                var xhrfs = new BrowserFS.FileSystem.XmlHttpRequest(lazyindex, urlbase);
                window.xhrfs = xhrfs;
                window.brewfs = brewfs;
                brewfs.mount('/xhrfs', xhrfs);
                BrowserFS.initialize(brewfs);
                var BREWFS = new BrowserFS.EmscriptenFS(_module.FS, _module.PATH); 
                
                em_mkdirs(_FS, gamedir);
                _FS.mount(BREWFS, {root: "/xhrfs"}, gamedir);
                _module.removeRunDependency("onsgamefs")
            }

            function sync_savefs(_FS, populate) {
                return new Promise((resolve, reject) => {
                    _FS.syncfs(populate, (err) => {
                        if(err) reject(err);
                        else resolve();
                    });
                });
            }

            async function load_remote_save(_FS, savedir, saveconfig) {
                if(!saveconfig || !saveconfig.loadUrl) return;
                var response = await fetch(saveconfig.loadUrl, {
                    cache: "no-store",
                    credentials: "same-origin"
                });
                if(response.status === 204 || response.status === 404) return;
                if(!response.ok) throw new Error("remote save load failed: " + response.status);
                await em_import(_FS, await response.arrayBuffer());
                await sync_savefs(_FS, false);
                console.log("## onsyuri_fs: remote save loaded", savedir);
            }

            async function upload_remote_save() {
                var saveconfig = g_onsyuri_index.save || {};
                if(!saveconfig.saveUrl || !g_onsyuri_module.FS) return;
                var files = em_lsfiles(g_onsyuri_module.FS, g_onsyuri_index.savedir);
                var data = await em_export_data(g_onsyuri_module.FS, files);
                var csrfToken = saveconfig.csrfToken || get_cookie("csrftoken");
                var response = await fetch(saveconfig.saveUrl, {
                    method: "POST",
                    cache: "no-store",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/zip",
                        "X-CSRFToken": csrfToken
                    },
                    body: data
                });
                if(!response.ok) throw new Error("remote save upload failed: " + response.status);
                console.log("## onsyuri_fs: remote save uploaded", files.length);
            }

            // mount --savedir using IDBFS
            function mount_save(_module, savedir) {
                var _FS = _module.FS;
                var _IDBFS = _module.IDBFS;
                console.log("## onsyuri_fs: mount_onssave", savedir);
                em_mkdirs(_FS, savedir);
                _FS.mount(_IDBFS, {}, savedir);
                var dependencyName = "onssavefs";
                if(_module.addRunDependency) _module.addRunDependency(dependencyName);
                _FS.syncfs(true, async (err)=>{
                    try {
                        if(err) throw err;
                        await load_remote_save(_FS, savedir, g_onsyuri_index.save);
                    }
                    catch(error) {
                        console.log(error);
                        onsyuri_debug("save-load-error", [error]);
                    }
                    finally {
                        if(_module.removeRunDependency) _module.removeRunDependency(dependencyName);
                    }
                });
            }
        </script>
        
        <script type="text/javascript"> // onsyuri C interface of val or function
            
            // flush the savedir to IDFBFS for persistence
            function flush_save() { 
                g_onsyuri_module.FS.syncfs(false, async (err)=>{
                    if(err) console.log(err);
                    else {
                        console.log("## onsyuri_fs: flush_save, sync finished");
                        try {
                            await upload_remote_save();
                        }
                        catch(error) {
                            console.log(error);
                            onsyuri_debug("save-upload-error", [error]);
                        }
                    }
                });
            }

            // fetch file from the remote server, and write them to local fs
            async function fetch_file(_FS, path, filemap) {
                var fnode = filemap[path];
                return new Promise((res)=>{
                    if(!fnode){
                        res(0);
                    }
                    else{
                        if(fnode.loaded) res(1);
                        fetch(fnode.url).then( (resp)=>{
                            return resp.arrayBuffer();
                        }).then((data)=>{
                            var writePaths = [path];
                            if(fnode.mountedPath && fnode.mountedPath !== path) {
                                writePaths.push(fnode.mountedPath);
                            }
                            for(var i = 0; i < writePaths.length; i++) {
                                var writePath = writePaths[i];
                                em_mkdirs(_FS, writePath.substring(0, writePath.lastIndexOf("/") + 1));
                                _FS.writeFile(writePath, new Uint8Array(data));
                            }
                            onsyuri_debug("fetch", [path, fnode.url, writePaths]);
                            fnode.loaded = true;
                            res(1);
                        }).catch((err)=>{
                            console.log("## fetch_file ${path}", err);
                            onsyuri_debug("fetch-error", [path, fnode.url, err]);
                            res(-1);
                        })
                    }
                })
            }
    
            const ONSYURI_PREFIX = ""; // prefix for mount, not used 
            const ONSYURI_INDEX_URL = document.querySelector( // the url to load onsyuri_index.json
                'meta[onsyuri_index]').attributes.onsyuri_index.textContent;
            const ONSYURI_JS_URL = document.querySelector(
                'meta[onsyuri_js]').attributes.onsyuri_js.textContent;
            const ONSYURI_WASM_URL = document.querySelector(
                'meta[onsyuri_wasm]').attributes.onsyuri_wasm.textContent;
            var g_onsyuri_index = {}; // onsyuri_index.json, game file index
            var g_onsyuri_filemap = {}; // filemap to record status of loaded files, used for lazyload
            var g_onsyuri_module  = {}; // onsyuri c module, FS and configure are here

        </script>

        <script type="text/javascript"> // onsyuri module
            g_onsyuri_module.canvas = (()=>{return document.getElementById('canvas');})();
            g_onsyuri_module.preRun = () => {
                console.log("## onsyuri: preRun");
                var lazyload = false;
                var urlbase = window.location.href;
                urlbase = urlbase.substring(0, urlbase.lastIndexOf("/") + 1);
                
                // lazyindex is deprecated as the sync sound problem
                if(g_onsyuri_index.lazyindex && g_onsyuri_index.lazyindex!=""){
                    mount_onsgame2(g_onsyuri_module, g_onsyuri_index.gamedir, 
                        g_onsyuri_index.lazyindex, urlbase);
                }
                else{
                    lazyload = g_onsyuri_index.lazyload||lazyload;
                    window.g_onsyuri_filemap = mount_game(
                        g_onsyuri_module.FS, g_onsyuri_index.gamedir, 
                        g_onsyuri_index.files, urlbase, lazyload
                    );
                }
                mount_save(g_onsyuri_module, g_onsyuri_index.savedir);
            };
            g_onsyuri_module.onRuntimeInitialized = () => {
                console.log("## onsyuri: onRuntimeInitialized");
            };
            
            (async() => {
                //return
                g_onsyuri_index = await load_json(ONSYURI_INDEX_URL);
                g_onsyuri_module.locateFile = (path, prefix) => {
                    if(path === "onsyuri.wasm") return ONSYURI_WASM_URL;
                    return prefix + path;
                };
                await load_js(ONSYURI_JS_URL); // dynamic load onsyuri.js
                await onsyuri(g_onsyuri_module);

                var args = [
                    "--root", ONSYURI_PREFIX + g_onsyuri_index.gamedir, 
                    "--font",  ONSYURI_PREFIX + g_onsyuri_index.gamedir + "/default.ttf", 
                    "--save-dir", g_onsyuri_index.savedir
                ];
                args = args.concat(g_onsyuri_index.args);
                console.log("## onsyuri: args", args);
                g_onsyuri_module.callMain(args);
            })();
        </script>

        <script type="text/javascript"> // onsyuri ui
            var g_fullstrech = false;
            var g_screen_height, g_screen_width; // initial in onsyuri C code
            var g_lastpressdown; // for longpress 
            const LONG_CLICK_TIME = 1200;
            const ONSCRIPTER_AUDIO_STORAGE_KEY = "hanplanet.onscripter.audio";
            var g_onscripter_audio_volume = 0.8;
            var g_onscripter_audio_previous_volume = 0.8;
            var g_onscripter_audio_muted = false;
            var g_onscripter_audio_gain = null;
            var g_onscripter_audio_source = null;
            var g_onscripter_audio_sync_timer = null;

            function clamp_onscripter_volume(value) {
                var number = Number(value);
                if(!Number.isFinite(number)) return 0.8;
                return Math.min(1, Math.max(0, number));
            }

            function load_onscripter_audio_state() {
                try {
                    var saved = JSON.parse(localStorage.getItem(ONSCRIPTER_AUDIO_STORAGE_KEY) || "{}");
                    if(typeof saved.volume !== "undefined") {
                        g_onscripter_audio_volume = clamp_onscripter_volume(saved.volume);
                    }
                    if(typeof saved.previousVolume !== "undefined") {
                        g_onscripter_audio_previous_volume = clamp_onscripter_volume(saved.previousVolume);
                    }
                    if(typeof saved.muted !== "undefined") {
                        g_onscripter_audio_muted = Boolean(saved.muted);
                    }
                }
                catch(error) {}
                if(g_onscripter_audio_previous_volume <= 0) {
                    g_onscripter_audio_previous_volume = g_onscripter_audio_volume > 0 ? g_onscripter_audio_volume : 0.8;
                }
            }

            function save_onscripter_audio_state() {
                try {
                    localStorage.setItem(ONSCRIPTER_AUDIO_STORAGE_KEY, JSON.stringify({
                        volume: g_onscripter_audio_volume,
                        previousVolume: g_onscripter_audio_previous_volume,
                        muted: g_onscripter_audio_muted
                    }));
                }
                catch(error) {}
            }

            function get_onscripter_effective_volume() {
                return g_onscripter_audio_muted ? 0 : g_onscripter_audio_volume;
            }

            function ensure_onscripter_audio_gain() {
                var sdl2 = g_onsyuri_module && g_onsyuri_module.SDL2;
                var audioContext = sdl2 && sdl2.audioContext;
                var audio = sdl2 && sdl2.audio;
                var source = audio && audio.scriptProcessorNode;
                if(!audioContext || !source || typeof audioContext.createGain !== "function") {
                    return false;
                }

                if(g_onscripter_audio_source !== source || !g_onscripter_audio_gain || g_onscripter_audio_gain.context !== audioContext) {
                    g_onscripter_audio_gain = audioContext.createGain();
                    g_onscripter_audio_gain.connect(audioContext.destination);
                    try {
                        source.disconnect();
                    }
                    catch(error) {}
                    source.connect(g_onscripter_audio_gain);
                    g_onscripter_audio_source = source;
                }
                return true;
            }

            function apply_onscripter_audio_state() {
                var volume = get_onscripter_effective_volume();
                var videoNode = document.getElementById("video");
                if(videoNode) {
                    videoNode.volume = volume;
                    videoNode.muted = volume <= 0;
                }

                if(ensure_onscripter_audio_gain()) {
                    var audioContext = g_onscripter_audio_gain.context;
                    if(g_onscripter_audio_gain.gain.setTargetAtTime) {
                        g_onscripter_audio_gain.gain.setTargetAtTime(volume, audioContext.currentTime, 0.015);
                    }
                    else {
                        g_onscripter_audio_gain.gain.value = volume;
                    }
                }
            }

            function resume_onscripter_audio_context() {
                var sdl2 = g_onsyuri_module && g_onsyuri_module.SDL2;
                var audioContext = sdl2 && sdl2.audioContext;
                if(audioContext && audioContext.state === "suspended" && audioContext.resume) {
                    audioContext.resume().catch(function() {});
                }
            }

            function update_onscripter_audio_controls() {
                var panel = document.getElementById("onscripter_audio_panel");
                var button = document.getElementById("onscripter_audio_mute");
                var volumeInput = document.getElementById("onscripter_audio_volume");
                var effectiveMuted = get_onscripter_effective_volume() <= 0;
                if(panel) panel.dataset.muted = effectiveMuted ? "true" : "false";
                if(button) {
                    button.setAttribute("aria-pressed", g_onscripter_audio_muted ? "true" : "false");
                    button.setAttribute("aria-label", effectiveMuted ? "Unmute audio" : "Mute audio");
                }
                if(volumeInput) {
                    volumeInput.value = String(Math.round(g_onscripter_audio_volume * 100));
                }
            }

            function start_onscripter_audio_sync() {
                if(g_onscripter_audio_sync_timer) return;
                apply_onscripter_audio_state();
                g_onscripter_audio_sync_timer = window.setInterval(apply_onscripter_audio_state, 750);
            }

            function setup_onscripter_audio_controls() {
                var button = document.getElementById("onscripter_audio_mute");
                var volumeInput = document.getElementById("onscripter_audio_volume");
                if(!button || !volumeInput) return;

                load_onscripter_audio_state();
                update_onscripter_audio_controls();
                apply_onscripter_audio_state();
                start_onscripter_audio_sync();

                button.addEventListener("click", function(event) {
                    event.preventDefault();
                    if(get_onscripter_effective_volume() > 0) {
                        g_onscripter_audio_previous_volume = g_onscripter_audio_volume || g_onscripter_audio_previous_volume || 0.8;
                        g_onscripter_audio_muted = true;
                    }
                    else {
                        g_onscripter_audio_muted = false;
                        if(g_onscripter_audio_volume <= 0) {
                            g_onscripter_audio_volume = g_onscripter_audio_previous_volume || 0.8;
                        }
                    }
                    update_onscripter_audio_controls();
                    apply_onscripter_audio_state();
                    save_onscripter_audio_state();
                    resume_onscripter_audio_context();
                });

                volumeInput.addEventListener("input", function() {
                    g_onscripter_audio_volume = clamp_onscripter_volume(Number(volumeInput.value) / 100);
                    if(g_onscripter_audio_volume > 0) {
                        g_onscripter_audio_previous_volume = g_onscripter_audio_volume;
                        g_onscripter_audio_muted = false;
                    }
                    update_onscripter_audio_controls();
                    apply_onscripter_audio_state();
                    save_onscripter_audio_state();
                    resume_onscripter_audio_context();
                });
            }

            function toggle_stretchfull() {
                g_fullstrech = !g_fullstrech;
                window.dispatchEvent(new Event('resize'));
            }

            function toggle_screenfull() {
                var body = document.getElementsByTagName('body')[0];
                if(window.innerHeight != screen.height) {
                    body.requestFullscreen({ navigationUI: "show" })
                    .then(()=>{ // can not use canvas.requestFullscreen
                        console.log("## after requestFullscreen");
                    });
                }
                else {
                    document.exitFullscreen();
                }
            }

            function toggle_onsmenu(){
                var canvas = document.getElementById('canvas');    
                var event = new KeyboardEvent("keydown", 
                    {bubbles: true, cancelable: true, keyCode: 0x1B}); // ESC key
                canvas.dispatchEvent(event);
                setTimeout(() => {
                    var event = new KeyboardEvent("keyup", 
                    {bubbles: true, cancelable: true, keyCode: 0x1B}); // ESC key
                    canvas.dispatchEvent(event);
                }, 50);
            }

            var g_skip = false;
            function toggle_skip() {
                g_skip = !g_skip;
                var canvas = document.getElementById('canvas');    
                var event = new KeyboardEvent(g_skip ? "keydown": "keyup", 
                    {bubbles: true, cancelable: true, keyCode: 0x11}); // ctrl key
                canvas.dispatchEvent(event);
            }

            function toggle_webinfo() {
                var onsyuri_webinfo = document.getElementById("onsyuri_webinfo");
                if(onsyuri_webinfo.style.display=="none") {
                    var first_line = onsyuri_webinfo.getElementsByTagName("p")[0];
                    first_line.innerText = `In Game <${g_onsyuri_index.title}>`
                    onsyuri_webinfo.style.display="block";
                }
                else{
                    onsyuri_webinfo.style.display="none";
                }
            }

            function toggle_webmenu() {
                var onsyuri_webrmenu = document.getElementById("onsyuri_webrmenu");
                if(onsyuri_webrmenu.style.display=="none") {
                    onsyuri_webrmenu.style.display = "flex";
                }
                else {
                    var onsyuri_webinfo = document.getElementById("onsyuri_webinfo");
                    onsyuri_webinfo.style.display = "none";
                    onsyuri_webrmenu.style.display = "none";
                }
            }

            function click_export() {
                var files = em_lsfiles(g_onsyuri_module.FS, g_onsyuri_index.savedir);
                em_export(g_onsyuri_module.FS, files);
            }

            async function click_import() {
                var data = await upload_data();
                await em_import(g_onsyuri_module.FS, data);
                flush_save();
            }

            function resize_onscripter_viewport() {
                var canvas = document.getElementById('canvas');
                var videoNode = document.getElementById('video');
                if(!canvas || !g_screen_width || !g_screen_height) return;
                var stage = document.querySelector(".onscripter-stage");
                var stageRect = stage ? stage.getBoundingClientRect() : null;
                var ratio = g_fullstrech && stageRect && stageRect.height
                    ? stageRect.width/stageRect.height
                    : g_screen_width/g_screen_height;
                scale_full(canvas, ratio);
                if(videoNode) scale_full(videoNode, ratio);
            }

            window.onresize = resize_onscripter_viewport;

            function setup_onscripter_layout_observer() {
                if(typeof ResizeObserver !== "function") return;
                var stage = document.querySelector(".onscripter-stage");
                var nav = document.querySelector(".ui-nav");
                var pending = false;
                var observer = new ResizeObserver(function() {
                    if(pending) return;
                    pending = true;
                    window.requestAnimationFrame(function() {
                        pending = false;
                        resize_onscripter_viewport();
                    });
                });
                if(stage) observer.observe(stage);
                if(nav) observer.observe(nav);
            }

            window.onkeydown = (event) => {
                switch(event.key) {
                    case "F2":
                        toggle_webinfo();
                        break;
                    case "F3":
                        click_export();
                        break;
                    case "F4":
                        click_import();
                        break;
                    case "F9":
                        toggle_webmenu();
                        break;
                    case "F10":
                        toggle_stretchfull();
                        break;
                    case "F11":
                        toggle_screenfull();
                        break;
                }
            }

            window.onmousedown = (event) => {
                if(event.button==0){
                    g_lastpressdown = event.timeStamp;
                }
            }

            window.onmouseup = (event) => {
                if(event.button==0){
                    if(event.timeStamp - g_lastpressdown > LONG_CLICK_TIME) {
                        var onsyuri_webrmenu = document.getElementById("onsyuri_webrmenu");
                        if(onsyuri_webrmenu.style.display=="none") toggle_webmenu();
                        g_lastpressdown = event.timeStamp;
                    }
                }
            }

            window.ontouchstart = (event) => {
                g_lastpressdown = event.timeStamp;
            }

            window.ontouchend = (event) => {
                if(event.timeStamp - g_lastpressdown > LONG_CLICK_TIME) {
                    var onsyuri_webrmenu = document.getElementById("onsyuri_webrmenu");
                    if(onsyuri_webrmenu.style.display=="none") toggle_webmenu();
                    g_lastpressdown = event.timeStamp;
                }
            }

            window.onmessage = (event)=> {
                console.log("## onsyuri: onmessage ", event.data);
                if(!event.data) return;
                switch(event.data) {
                    case "onsinit":
                        var body = document.getElementsByTagName("body")[0];
                        var onsyuri_webinfo = document.getElementById("onsyuri_webinfo");
                        if(body) {
                            body.style.removeProperty("background");
                            body.style.removeProperty("background-color");
                            body.style.removeProperty("background-image");
                        }
                        if(onsyuri_webinfo) onsyuri_webinfo.style.display = "none";
                        apply_onscripter_audio_state();
                        resize_onscripter_viewport();
                        break;
                }
            }

            setup_onscripter_layout_observer();
            setup_onscripter_audio_controls();
        </script>
        
        <script type="text/javascript"> // onsyuri video 
            const video=document.getElementById("video");

            function videoEnded(){
                g_onsyuri_module.canvas.style.display="block";
                video.style.display="none";
                if (video.src && video.src.startsWith('blob:')) {
                    URL.revokeObjectURL(video.src);
                    video.src='';
                }
                g_onsyuri_module.wait_video=false;
            }

            function playVideo(path, click_flag, loop_flag){
                g_onsyuri_module.wait_video=true;
                const fileData = g_onsyuri_module.FS.readFile(path, {flags:'r',encoding:'binary'});
                const videoBlob = new Blob([fileData.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(videoBlob);
                video.src = videoUrl;

                g_onsyuri_module.canvas.style.display="none";
                video.style.display="block";

                video.onclick=click_flag?videoEnded:null;
                video.loop=loop_flag;

                video.play();
            }

            video.addEventListener('error', function(event) {
                console.error('The video failed to load: ', event);
                videoEnded();
            });

        </script>
