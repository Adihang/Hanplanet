<footer class="site-footer-links" aria-label="Legal links">
    <div class="site-footer-nav">
        <a class="site-footer-link" href="{{ privacy_url }}">Privacy Policy</a>
        <span class="site-footer-sep">/</span>
        <a class="site-footer-link" href="{{ terms_url }}">Terms of Service</a>
    </div>
    {% if is_root_entry %}
    <p class="site-footer-purpose">{% include 'partials/ui_i18n.html' with key='root_footer_purpose' %}</p>
    {% endif %}
</footer>

<script>
(function () {
    document.querySelectorAll(".site-footer-links .site-footer-link").forEach(function (link) {
        link.addEventListener("click", function (e) {
            e.preventDefault();
            window.open(link.href, "_blank", "popup,width=900,height=700,scrollbars=yes,resizable=yes,toolbar=no,menubar=no,location=no,status=no");
        });
    });
    document.querySelectorAll("[data-legal-popup-url]").forEach(function (btn) {
        btn.addEventListener("click", function () {
            window.open(btn.getAttribute("data-legal-popup-url"), "_blank", "popup,width=900,height=700,scrollbars=yes,resizable=yes,toolbar=no,menubar=no,location=no,status=no");
        });
    });
})();
</script>
