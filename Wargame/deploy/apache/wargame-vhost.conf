# Hanplanet Wargame Apache vhost.
# Native fallback requires mod_headers, mod_rewrite, mod_proxy, and mod_proxy_fcgi.

Listen 127.0.0.1:8090

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:8090>
    ServerName wargame.hanplanet.com
    DocumentRoot "/Users/imhanbyeol/Development/Hanplanet/Wargame/public"
    DirectoryIndex index.php
    AcceptPathInfo Off

    ErrorLog "/Users/imhanbyeol/Development/Hanplanet/Wargame/data/apache-error.log"
    CustomLog "/Users/imhanbyeol/Development/Hanplanet/Wargame/data/apache-access.log" "%h %l %u %t \"%m %U %H\" %>s %b"

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^(wargame\.hanplanet\.com|localhost|127\.0\.0\.1)(:8090)?$ [NC]
    RewriteRule ^ - [R=421,L]

    <Directory />
        AllowOverride None
        Require all denied
    </Directory>

    <Directory "/Users/imhanbyeol/Development/Hanplanet/Wargame">
        AllowOverride None
        Require all denied
    </Directory>

    <Directory "/Users/imhanbyeol/Development/Hanplanet/Wargame/public">
        Options -Indexes -Includes -ExecCGI -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    <LocationMatch "^/(?:app|data|database|deploy|scripts)(?:/|$)">
        Require all denied
    </LocationMatch>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "(?i)\.(?:db|ini|log|sql|sqlite|sqlite3|bak)$">
        Require all denied
    </FilesMatch>

    <IfModule proxy_fcgi_module>
        <FilesMatch "\.php$">
            SetHandler "proxy:fcgi://127.0.0.1:9000"
        </FilesMatch>
        ProxyFCGISetEnvIf "true" WARGAME_TRUST_PROXY "1"
        ProxyFCGISetEnvIf "true" WARGAME_PUBLIC_URL "https://wargame.hanplanet.com/"
        ProxyFCGISetEnvIf "true" WARGAME_DJANGO_BASE_URL "https://www.hanplanet.com"
        ProxyFCGISetEnvIf "true" PHP_ADMIN_VALUE "expose_php=Off\nopen_basedir=/Users/imhanbyeol/Development/Hanplanet/Wargame:/tmp:/private/tmp:/etc/ssl:/opt/homebrew/etc/openssl@3\ndisable_functions=exec,passthru,shell_exec,system,proc_open,popen\nsession.save_path=/Users/imhanbyeol/Development/Hanplanet/Wargame/data/sessions\nsession.use_strict_mode=1\nsession.use_only_cookies=1\nsession.cookie_httponly=1\nsession.cookie_samesite=Lax"
    </IfModule>

    Header always unset Access-Control-Allow-Credentials
    Header always unset Access-Control-Allow-Origin
    Header always unset X-Powered-By
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
</VirtualHost>
