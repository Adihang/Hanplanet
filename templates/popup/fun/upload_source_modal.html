<div class="image-color-picker-modal-backdrop image-color-picker-source-modal-backdrop" data-upload-source-modal hidden>
    <section class="image-color-picker-modal image-color-picker-source-modal" role="dialog" aria-modal="true" aria-labelledby="uploadSourceModalTitle">
        <header class="image-color-picker-modal-head">
            <h2 class="image-color-picker-modal-title" id="uploadSourceModalTitle">{{ upload_source_modal_title }}</h2>
            <button class="image-color-picker-modal-close" type="button" data-upload-source-close aria-label="{{ handrive_close_label }}">×</button>
        </header>
        <div class="image-color-picker-source-options">
            <button class="image-color-picker-source-option" type="button" data-upload-source-local>
                <span class="image-color-picker-source-option-icon">L</span>
                <span class="image-color-picker-source-option-label">{{ upload_source_local_label }}</span>
            </button>
            {% if handrive_picker_enabled %}
                <button class="image-color-picker-source-option" type="button" data-upload-source-handrive>
                    <span class="image-color-picker-source-option-icon">H</span>
                    <span class="image-color-picker-source-option-label">{{ upload_source_handrive_label }}</span>
                </button>
            {% endif %}
        </div>
    </section>
</div>
