<div id="minecraftPlayerDetailModal" class="handrive-help-modal minecraft-player-detail-modal" hidden>
    <div class="handrive-help-modal-backdrop site-modal-backdrop" id="minecraft-player-detail-backdrop"></div>
    <div class="handrive-help-modal-dialog site-modal-dialog minecraft-player-detail-dialog" data-popup-fit-bottom role="dialog" aria-modal="true" aria-labelledby="minecraft-player-detail-title">
        <header class="handrive-help-modal-head site-modal-head minecraft-player-detail-modal-head">
            <h2 class="minecraft-panel-title" id="minecraft-player-detail-title">{{ player_detail_title }}</h2>
            {% include "popup/handrive/_popup_close_button.html" with button_id="minecraft-player-detail-close-btn" click_target_id="minecraft-player-detail-backdrop" %}
        </header>
        <section class="minecraft-player-detail-body" id="minecraftPlayerDetailBody" aria-live="polite"></section>
    </div>
</div>
