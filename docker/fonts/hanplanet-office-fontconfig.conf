<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <alias binding="same">
        <family>KoPub돋움체_Pro Medium</family>
        <accept>
            <family>KoPub돋움체 Medium</family>
            <family>KoPubDotum Medium</family>
        </accept>
    </alias>
    <alias binding="same">
        <family>KoPub돋움체_Pro Bold</family>
        <accept>
            <family>KoPub돋움체 Bold</family>
            <family>KoPubDotum Bold</family>
        </accept>
    </alias>
    <alias binding="same">
        <family>맑은 고딕</family>
        <accept>
            <family>NanumGothic</family>
            <family>Noto Sans CJK KR</family>
        </accept>
    </alias>
    <alias binding="same">
        <family>Malgun Gothic</family>
        <accept>
            <family>NanumGothic</family>
            <family>Noto Sans CJK KR</family>
        </accept>
    </alias>
    <alias binding="same">
        <family>Aptos</family>
        <accept>
            <family>Carlito</family>
            <family>Liberation Sans</family>
        </accept>
    </alias>
    <alias binding="same">
        <family>Aptos Display</family>
        <accept>
            <family>Carlito</family>
            <family>Liberation Sans</family>
        </accept>
    </alias>
    <alias binding="same">
        <family>Arial</family>
        <accept>
            <family>Liberation Sans</family>
            <family>Arimo</family>
        </accept>
    </alias>
    <alias binding="same">
        <family>Times New Roman</family>
        <accept>
            <family>Liberation Serif</family>
            <family>Tinos</family>
        </accept>
    </alias>
</fontconfig>
