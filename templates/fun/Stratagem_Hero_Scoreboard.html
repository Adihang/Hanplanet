{% load static static_versioned %}

<!doctype html>
<html lang="ko">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta name="description" content="Helldivers Sub">
        <meta name="author" content="Hanplanet">
        <meta name="generator" content="Django">
        <meta name="robots" content="noindex">
        <meta property="og:title" content="Stratagem Hero">
        <meta property="og:description" content="Helldivers Sub">
        <meta property="og:image" content="https://github.com/Adihang/Hanplanet/assets/56463432/484730d2-3edb-47ee-b598-206096312261">
        {% include "partials/pwa.html" %}
        {% include "partials/static_script_fallback.html" %}
        
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
        <link rel="icon" type="image/png" href="{% static 'media/icons/pwa-192.png' %}">
        <link rel="stylesheet" type="text/css" href="{% static_v 'css/vendor/bootstrap.min.css' %}">
        <link rel="stylesheet" type="text/css" href="{% static_v 'css/common/style.css' %}">
        <link rel="stylesheet" type="text/css" href="{% static_v 'css/fun/stratagem/style.css' %}">
        <script src="{% static_v 'js/fun/stratagem/scoreboard.js' %}" type="text/javascript" defer onerror="window.__reloadStaticScript(this)"></script>
        <title>
            Stratagem Hero</title>
    </head>
    <body>
        <div class="stratagem_page">
            <div class="stratagem_content">
                <div class="stratagem_scoreboard">
                    <h1 class="scoreboard_text">Global Scoreboard</h1>
                    <div class="global_scores">
                        {% for score in scores %}
                        <div class="global_score">
                            <h3 class="global_score_name">{{ forloop.counter }}. {{ score.name }}</h3>
                            <h5 class="global_score_time">{{ score.score }}초</h5>
                        </div>
                        {% endfor %}
                    </div>
                    <div class="scoreboard_actions">
                        <button class="ui-btn ui-btn-primary" id="scoreboard_replay_btn" type="button">다시 하기</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="sub-footer">
            <hr class="stratagem_hr">
            <div class="lowtext">made by Adihang</div>
        </div>
    </body>
</html>
