<form
    method="post"
    {% if handrive_2fa_action_url %}action="{{ handrive_2fa_action_url }}"{% endif %}
    class="auth-form site-loading-host"
    id="handrive-2fa-form"
    {% if site_auth_is_modal %}data-auth-form{% endif %}
    {% if handrive_api_login_2fa_resend_code_url %}
    data-login-2fa-resend-success="{{ handrive_text.auth_2fa_resend_success }}"
    data-login-2fa-resend-fallback="재전송에 실패했습니다."
    data-auth-generic-error="오류가 발생했습니다. 다시 시도해주세요."
    {% endif %}
>
    {% csrf_token %}

    {% if handrive_2fa_error_message %}
        <div class="auth-error" id="handrive-2fa-error">{{ handrive_2fa_error_message }}</div>
    {% else %}
        <div class="auth-error" id="handrive-2fa-error" style="display:none;"></div>
    {% endif %}

    <p class="ui-subtitle auth-2fa-hint">{{ handrive_text.auth_2fa_hint }} <strong>{{ handrive_2fa_user_email_masked }}</strong></p>
    <div id="handrive-2fa-resend-msg" class="auth-2fa-resend-msg" data-auth-2fa-resend-msg hidden></div>

    <div class="auth-field auth-field-full">
        <div class="auth-otp-input-wrap" data-handrive-otp-wrap>
            <input
                class="auth-otp-hidden-input"
                type="text"
                name="code"
                id="handrive-2fa-code-input"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="6"
                pattern="[0-9]*"
                required
                autofocus
                aria-label="{{ handrive_text.auth_2fa_code_label }}"
                placeholder="{{ handrive_text.auth_2fa_code_placeholder }}"
                data-handrive-otp-input
            >
            <div class="auth-otp-boxes" data-handrive-otp-boxes aria-hidden="true">
                <span class="auth-otp-box" data-index="0"></span>
                <span class="auth-otp-box" data-index="1"></span>
                <span class="auth-otp-box" data-index="2"></span>
                <span class="auth-otp-box" data-index="3"></span>
                <span class="auth-otp-box" data-index="4"></span>
                <span class="auth-otp-box" data-index="5"></span>
            </div>
        </div>
    </div>

    <div class="auth-actions auth-2fa-actions">
        {% if handrive_api_login_2fa_resend_code_url %}
            <button
                type="button"
                class="auth-2fa-resend-link"
                id="handrive-2fa-resend-btn"
                data-resend-url="{{ handrive_api_login_2fa_resend_code_url }}"
            >
                {{ handrive_text.auth_2fa_resend_button }}
            </button>
        {% endif %}
        <button class="ui-btn ui-btn-primary auth-2fa-submit-btn" type="submit">{{ handrive_text.auth_2fa_submit }}</button>
    </div>
</form>
