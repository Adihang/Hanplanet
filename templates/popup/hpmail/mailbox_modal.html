<section class="hpmail-mailbox-modal" data-hpmail-mailbox-modal role="dialog" aria-modal="true" aria-labelledby="hpmail-mailbox-modal-title" hidden>
    <div class="hpmail-mailbox-modal-backdrop site-modal-backdrop" data-hpmail-mailbox-modal-close></div>
    <form class="hpmail-mailbox-modal-dialog site-modal-dialog" data-hpmail-mailbox-form>
        <div class="hpmail-mailbox-modal-head site-modal-head">
            <strong id="hpmail-mailbox-modal-title" data-hpmail-mailbox-modal-title>메일함 추가</strong>
            <button class="hpmail-icon-btn site-modal-close" type="button" data-hpmail-mailbox-modal-close aria-label="닫기" title="닫기">
                <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
            </button>
        </div>
        <label class="hpmail-mailbox-modal-field">
            <span>메일함 이름</span>
            <input type="text" name="name" maxlength="80" autocomplete="off" data-hpmail-mailbox-name required>
        </label>
        <div class="hpmail-mailbox-modal-status" data-hpmail-mailbox-modal-status role="status" aria-live="polite"></div>
        <div class="hpmail-mailbox-modal-actions">
            <button class="hpmail-secondary-btn" type="button" data-hpmail-mailbox-modal-close>취소</button>
            <button class="hpmail-primary-btn" type="submit" data-hpmail-mailbox-submit>저장</button>
        </div>
    </form>
</section>
