name: MinecraftAccountLink
version: 1.0.0
main: dev.minecraftlink.bridge.MinecraftAccountLinkPlugin
api-version: "26.2"
description: Links Minecraft players to a website account through short-lived codes.
softdepend:
  - floodgate
commands:
  link:
    description: Link this Minecraft account to a website account.
    usage: /link <code>
    aliases:
      - accountlink
      - mcaccountlink
