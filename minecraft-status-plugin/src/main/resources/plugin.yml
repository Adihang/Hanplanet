name: MinecraftStatusBridge
version: 2.0.0
main: dev.minecraftstatus.bridge.MinecraftStatusBridgePlugin
api-version: "26.2"
description: Writes Minecraft server status JSON and exposes trusted player-state and trade commands.
commands:
  minecraftstatus:
    description: Modify Minecraft player status and trades from trusted admin tooling.
    usage: /minecraftstatus <set|trade> ...
    permission: minecraftstatus.admin
permissions:
  minecraftstatus.admin:
    description: Allows modifying player state through status tooling.
    default: op
