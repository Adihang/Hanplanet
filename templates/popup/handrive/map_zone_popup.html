<div class="map-name-popup-overlay" id="map-name-popup-overlay" hidden>
    <div class="map-name-popup">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0;">
            <h4 id="map-name-popup-title">{{ handrive_text.map_zone_title }}</h4>
            <div style="display:inline-flex;align-items:center;gap:6px;">
                <label title="{{ handrive_text.map_clickable_title }}" style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;">
                    <input type="checkbox" id="map-name-popup-clickable" checked style="margin:0;width:22px;height:22px;">
                    <svg viewBox="0 0 20 20" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l5 7-3 .4 2 5.6-2.2.8-2-5.5-2.4 1.9L8 3z"/></svg>
                </label>
                <label title="{{ handrive_text.map_zone_icon_visible_title }}" style="display:inline-flex;align-items:center;gap:4px;cursor:pointer;user-select:none;">
                    <input type="checkbox" id="map-name-popup-icon-visible" checked style="margin:0;width:22px;height:22px;">
                    <svg viewBox="0 0 20 20" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="10" cy="10" rx="8" ry="5"/><circle cx="10" cy="10" r="2.5"/></svg>
                </label>
            </div>
        </div>
        <div id="map-name-popup-icon-section" style="display:none;">
            <div style="font-size:15px;margin-bottom:4px;">{{ handrive_text.map_icon_label }}</div>
            <div class="map-editor-icon-grid" id="map-name-popup-icons" style="margin-bottom:10px;"></div>
        </div>
        <input type="text" id="map-name-popup-input" placeholder="{{ handrive_text.map_name_placeholder }}" autocomplete="off">
        <label id="map-name-popup-desc-label" style="font-size:15px;display:block;margin-top:8px;">{{ handrive_text.map_desc_label }}
            <textarea id="map-name-popup-desc" rows="3" placeholder="{{ handrive_text.map_desc_placeholder }}" autocomplete="off" style="margin-top:4px;width:100%;box-sizing:border-box;resize:vertical;"></textarea>
        </label>
        <div id="map-name-popup-image-section" style="margin-top:8px;">
            <div style="font-size:15px;margin-bottom:4px;">{{ handrive_text.map_image_label }}</div>
            <div id="map-name-popup-image-list" class="map-popup-image-list" style="display:none;"></div>
            <div id="map-name-popup-image-preview" style="display:none;margin-bottom:6px;position:relative;">
                <img id="map-name-popup-image-img" src="" style="max-width:100%;max-height:120px;border-radius:4px;display:block;">
                <button type="button" id="map-name-popup-image-remove" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.5);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:1;padding:0;">✕</button>
            </div>
            <label class="ui-btn" style="cursor:pointer;font-size:15px;display:inline-flex;align-items:center;gap:5px;">
                <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="4" x2="10" y2="16"/><line x1="4" y1="10" x2="16" y2="10"/></svg>
                {{ handrive_text.map_image_attach }}
                <input type="file" id="map-name-popup-image-input" accept="image/*" multiple hidden>
            </label>
        </div>
        <div id="map-name-popup-video-section" style="margin-top:8px;">
            <div style="font-size:15px;margin-bottom:4px;">{{ handrive_text.map_video_label }}</div>
            <div id="map-name-popup-video-list" class="map-popup-video-list" style="display:none;"></div>
            <div id="map-name-popup-video-preview" style="display:none;margin-bottom:6px;position:relative;">
                <video id="map-name-popup-video-video" src="" controls playsinline style="max-width:100%;max-height:120px;border-radius:4px;display:block;background:#000;"></video>
                <button type="button" id="map-name-popup-video-remove" style="position:absolute;top:2px;right:2px;background:rgba(0,0,0,0.5);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;line-height:1;padding:0;">✕</button>
            </div>
            <label class="ui-btn" style="cursor:pointer;font-size:15px;display:inline-flex;align-items:center;gap:5px;">
                <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="4" x2="10" y2="16"/><line x1="4" y1="10" x2="16" y2="10"/></svg>
                {{ handrive_text.map_video_attach }}
                <input type="file" id="map-name-popup-video-input" accept="video/*" multiple hidden>
            </label>
        </div>
        <div style="font-size:15px;color:var(--handrive-text-muted,#888);min-height:1em;" id="map-name-popup-bind-display"></div>
        <div class="map-name-popup-actions">
            <button type="button" class="ui-btn ui-btn-danger" id="map-name-popup-delete" style="margin-right:auto;color:#e53935;display:none;">{{ handrive_text.map_delete_button_label }}</button>
            <button type="button" class="ui-btn" id="map-name-popup-bind" title="{{ handrive_text.map_bind_title }}">{{ handrive_text.map_bind_button }}</button>
            <button type="button" class="ui-btn" id="map-name-popup-cancel">{{ handrive_text.cancel }}</button>
            <button type="button" class="ui-btn ui-btn-primary" id="map-name-popup-confirm">{{ handrive_text.map_confirm_button }}</button>
        </div>
    </div>
</div>
