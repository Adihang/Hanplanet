<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signing out</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        body {
            display: none;
        }
    </style>
</head>
<body>
    <form id="hp-auth-logout-bridge-form" action="{{ logout_url }}" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ logout_next_url }}">
    </form>
    <script>
        (function () {
            var form = document.getElementById("hp-auth-logout-bridge-form");
            if (!form) {
                window.location.replace("{{ logout_next_url|escapejs }}");
                return;
            }
            if (typeof form.requestSubmit === "function") {
                form.requestSubmit();
                return;
            }
            form.submit();
        })();
    </script>
</body>
</html>
