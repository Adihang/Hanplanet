<div class="image-demo-modal-backdrop site-modal-backdrop" data-image-pip-code-modal hidden>
    <section class="image-demo-modal site-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="image-pip-demo-code-title">
        <header class="image-demo-modal-head site-modal-head">
            <h2 class="image-demo-modal-title" id="image-pip-demo-code-title">{{ example_code_title }}</h2>
            <div class="image-demo-modal-actions">
                <button class="ui-btn image-pip-demo-copy-button" type="button" data-image-pip-code-copy data-copy-label="{{ example_code_copy_label }}" data-copied-label="{{ example_code_copied_label }}">
                    {{ example_code_copy_label }}
                </button>
                <button class="image-demo-modal-close site-modal-close" type="button" data-image-pip-code-close aria-label="{{ example_code_close_label }}">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        </header>
        <pre class="image-pip-demo-code-block"><code data-image-pip-code></code></pre>
    </section>
</div>
