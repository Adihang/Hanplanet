{% load static static_versioned %}
<!doctype html>
<html lang="{{ ui_lang|default:'ko' }}">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{{ page_description }}">
    <meta property="og:title" content="{{ page_title }} | Hanplanet">
    <meta property="og:description" content="{{ page_description }}">
    <meta property="og:image" content="{{ page_image_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page_title }} | Hanplanet">
    <meta name="twitter:description" content="{{ page_description }}">
    <meta name="twitter:image" content="{{ page_image_url }}">
    <meta name="author" content="Hanplanet">
    <meta name="robots" content="noindex">
    {% include "partials/pwa.html" %}
    {% include "partials/static_script_fallback.html" %}
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="{% static 'media/icons/pwa-192.png' %}">
    <link rel="stylesheet" type="text/css" href="{% static_v 'css/common/style.css' %}">
    <script src="{% static_v 'js/common/site.js' %}" type="text/javascript" defer onerror="window.__reloadStaticScript(this)"></script>
    <title>{{ page_title }} | Hanplanet</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: rgb(248, 245, 238);
            cursor: default;
        }

        #textBubbleCanvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #speakiCursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 84px;
            height: 84px;
            pointer-events: none;
            user-select: none;
            transform-origin: 50% 50%;
            z-index: 20;
            opacity: 0;
            will-change: transform, opacity;
        }

        #pageTurnOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 15;
            pointer-events: none;
        }
        #turnBook {
            position: relative;
        }
        #turnBook .page {
            padding: 0;
            margin: 0;
        }
    </style>
    <script src="{% static_v 'js/vendor/jquery.min.js' %}"></script>
    <script src="{% static_v 'js/vendor/turn.min.js' %}"></script>
</head>
<body>
    <canvas id="textBubbleCanvas"></canvas>
    <div id="pageTurnOverlay">
        <div id="turnBook"></div>
    </div>
    <img
        id="speakiCursor"
        src="{% static_v 'media/Spikip/speaki_default/icon/main.png' %}"
        alt=""
        aria-hidden="true"
    >

    <script>
        window.__textBubbleBubbleAssetUrl = "{% static_v 'media/Spikip/speaki_pumkin/icon/pumkin.png' %}";
        window.__textBubbleCursorAssets = {
            defaultSets: [
                ["{% static_v 'media/Spikip/speaki_default/icon/default/1/1.png' %}", "{% static_v 'media/Spikip/speaki_default/icon/default/1/2.png' %}"],
                ["{% static_v 'media/Spikip/speaki_default/icon/default/2/12.png' %}", "{% static_v 'media/Spikip/speaki_default/icon/default/2/13.png' %}"],
                ["{% static_v 'media/Spikip/speaki_default/icon/default/3/14.png' %}", "{% static_v 'media/Spikip/speaki_default/icon/default/3/15.png' %}"]
            ],
            crashSets: [
                ["{% static_v 'media/Spikip/speaki_default/icon/crash/1/1.png' %}", "{% static_v 'media/Spikip/speaki_default/icon/crash/1/2.png' %}"],
                ["{% static_v 'media/Spikip/speaki_default/icon/crash/2/1.png' %}", "{% static_v 'media/Spikip/speaki_default/icon/crash/2/2.png' %}"],
                ["{% static_v 'media/Spikip/speaki_default/icon/crash/3/1.png' %}", "{% static_v 'media/Spikip/speaki_default/icon/crash/3/2.png' %}"]
            ],
            defeatStages: [
                "{% static_v 'media/Spikip/speaki_default/icon/defeat/1/1.png' %}",
                "{% static_v 'media/Spikip/speaki_default/icon/defeat/1/2.png' %}",
                "{% static_v 'media/Spikip/speaki_default/icon/defeat/1/3.png' %}"
            ],
            accStages: [
                "{% static_v 'media/Spikip/speaki_default/icon/acc/1/1.png' %}",
                "{% static_v 'media/Spikip/speaki_default/icon/acc/1/2.png' %}",
                "{% static_v 'media/Spikip/speaki_default/icon/acc/1/3.png' %}"
            ]
        };
    </script>

    <script type="module" src="{% static_v 'js/fun/text_bubble/page.js' %}"></script>
</body>
</html>
