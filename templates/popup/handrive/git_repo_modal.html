<div id="handrive-git-repo-modal" class="handrive-rename-modal" hidden>
    <div class="handrive-rename-modal-backdrop" id="handrive-git-repo-modal-backdrop"></div>
    <div class="handrive-rename-modal-dialog" data-popup-fit-bottom role="dialog" aria-modal="true" aria-labelledby="handrive-git-repo-title">
        <h3 id="handrive-git-repo-title" class="handrive-rename-title">{{ handrive_text.git_repo_create_title }}</h3>
        <div class="handrive-rename-target" id="handrive-git-repo-target"></div>

        {# 생성 폼 #}
        <div id="handrive-git-repo-form">
            <label class="handrive-field handrive-field-full">
                <span>{{ handrive_text.git_repo_name_label }}</span>
                <input type="text" id="handrive-git-repo-name-input" placeholder="{{ handrive_text.git_repo_name_placeholder }}">
            </label>
            <div class="handrive-rename-actions" style="padding-top:12px;">
                <button type="button" class="ui-btn" id="handrive-git-repo-cancel-btn">{{ handrive_text.cancel }}</button>
                <button type="button" class="ui-btn ui-btn-primary" id="handrive-git-repo-confirm-btn">{{ handrive_text.create_button }}</button>
            </div>
        </div>

        {# 상태 / 관리 영역 #}
        <div id="handrive-git-repo-status" hidden>
            <p id="handrive-git-repo-status-msg" style="margin:0 0 12px;"></p>

            {# Clone URL 영역 #}
            <div id="handrive-git-repo-clone-info" hidden style="margin-bottom:12px;">
                <div style="font-size:0.8em;color:var(--handrive-text-secondary);margin-bottom:4px;">Clone URL</div>
                <div style="display:flex;gap:6px;align-items:center;">
                    <input type="text" id="handrive-git-repo-clone-url-input"
                           readonly
                           style="flex:1;font-size:0.82em;padding:5px 8px;border:1px solid var(--handrive-border);border-radius:6px;background:var(--handrive-surface-subtle);color:var(--handrive-text);min-width:0;">
                    <button type="button" class="ui-btn" id="handrive-git-repo-copy-btn" title="{{ handrive_text.git_repo_copy_button }}" style="flex-shrink:0;padding:5px 10px;">{{ handrive_text.git_repo_copy_button }}</button>
                </div>
            </div>

            <div class="handrive-rename-actions" style="margin-top:4px;">
                <button type="button" class="ui-btn" id="handrive-git-repo-close-btn">{{ handrive_text.close_label }}</button>
                <button type="button" class="ui-btn" id="handrive-git-repo-open-btn" hidden>{{ handrive_text.git_repo_open_button }}</button>
                <button type="button" class="ui-btn ui-btn-primary" id="handrive-git-repo-retry-btn" hidden>{{ handrive_text.git_repo_retry_button }}</button>
            </div>
        </div>
    </div>
</div>
