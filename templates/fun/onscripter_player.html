{% extends 'base.html' %}
{% load static_versioned %}
{% block body_class %}ui-page onscripter-player-page{% endblock %}
{% block extra_head %}
        <meta onsyuri_js="{{ engine_js_url }}">
        <meta onsyuri_wasm="{{ engine_wasm_url }}">
        <meta onsyuri_index="{{ index_url }}">
        <style>
            body.onscripter-player-page #onscripter_canvas_frame:not(.is-onscripter-canvas-ready) {
                aspect-ratio: 4 / 3;
                width: min(100%, calc(100svh * 4 / 3));
                max-width: 100%;
                max-height: 100%;
            }

            body.onscripter-player-page #onscripter_canvas_frame:not(.is-onscripter-canvas-ready) #canvas,
            body.onscripter-player-page #onscripter_canvas_frame:not(.is-onscripter-canvas-ready) #video,
            body.onscripter-player-page #onscripter_rotate_toggle,
            body.onscripter-player-page #onscripter_bottom_controls,
            body.onscripter-player-page #onscripter_canvas_controls {
                visibility: hidden;
                pointer-events: none;
            }

            body.onscripter-player-page #onscripter_audio_volume {
                width: 32px;
                height: 92px;
                min-width: 0;
                margin: 0;
                opacity: 0;
                pointer-events: none;
                writing-mode: vertical-lr;
                direction: rtl;
                -webkit-appearance: slider-vertical;
            }
        </style>
        <script>
            (function () {
                var desiredTitle = "{{ meta_title|escapejs }}";
                if(!desiredTitle) return;

                var restoring = false;
                function restoreOnscripterDocumentTitle() {
                    if(restoring || document.title === desiredTitle) return;
                    restoring = true;
                    document.title = desiredTitle;
                    restoring = false;
                }

                window.restore_onscripter_document_title = restoreOnscripterDocumentTitle;
                restoreOnscripterDocumentTitle();

                function installOnscripterTitleGuard() {
                    restoreOnscripterDocumentTitle();

                    if(typeof MutationObserver === "function" && !window.__onscripter_title_head_observer && document.head) {
                        window.__onscripter_title_head_observer = new MutationObserver(restoreOnscripterDocumentTitle);
                        window.__onscripter_title_head_observer.observe(document.head, {
                            childList: true,
                            characterData: true,
                            subtree: true
                        });
                    }

                    if(!window.__onscripter_title_guard_timer) {
                        var guardUntil = Date.now() + 15000;
                        window.__onscripter_title_guard_timer = window.setInterval(function () {
                            restoreOnscripterDocumentTitle();
                            if(Date.now() > guardUntil) {
                                window.clearInterval(window.__onscripter_title_guard_timer);
                                window.__onscripter_title_guard_timer = null;
                            }
                        }, 250);
                    }
                }

                if(document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", installOnscripterTitleGuard, {once: true});
                } else {
                    installOnscripterTitleGuard();
                }
                window.addEventListener("load", installOnscripterTitleGuard, {once: true});
            })();
        </script>
{% endblock %}

        <script type="text/javascript"> // browser universe function
            function scale_full(docobj, ratio=0) {
                var host = docobj.closest(".onscripter-stage") || docobj.parentElement;
                var hostRect = host ? host.getBoundingClientRect() : null;
                var w = hostRect && hostRect.width ? hostRect.width : window.innerWidth;
                var h = hostRect && hostRect.height ? hostRect.height : window.innerHeight;
                var rotated = typeof is_onscripter_canvas_rotated === "function" && is_onscripter_canvas_rotated();
                var layoutWidth = rotated ? h : w;
                var layoutHeight = rotated ? w : h;
                var targetWidth = layoutWidth;
                var targetHeight = layoutHeight;
                if(ratio>0) {
                    if(layoutWidth/layoutHeight > ratio) {
                        targetWidth = layoutHeight * ratio;
                        targetHeight = layoutHeight;
                    }
                    else {
                        targetWidth = layoutWidth;
                        targetHeight = layoutWidth / ratio;
                    }
                }
                docobj.style.width  = targetWidth + "px";
                docobj.style.height = targetHeight + "px";
                var frame = document.getElementById("onscripter_canvas_frame");
                if(frame && (docobj.id === "canvas" || docobj.id === "video")) {
                    frame.style.width = targetWidth + "px";
                    frame.style.height = targetHeight + "px";
                }
                return {w: docobj.style.width, h: docobj.style.height}
            }
            
            async function delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async function send_worker(worker, data) {
                worker.postMessage(data);
                return new Promise((res)=>{
                    worker.onmessage = (event)=>{
                        res(event.data);
                    };
                })
            };

            async function load_json(url) {
                return new Promise((res)=>{
                    fetch(url).then((res)=>res.json())
                    .then((json)=>(res(json)));
                })
            }

            async function load_js(url) {
                var script = document.createElement('script');
                script.type = "text/javascript";
                script.src = url;
                document.getElementsByTagName("body")[0].appendChild(script);
                return new Promise((res)=>{
                    script.onload = () =>{
                        res(1);
                    }
                })
            }

            async function download_data (name, data) {
                var blob = new Blob([data], {type:'application/octet-stream'});
                var e = document.createEvent('MouseEvents');
                var a = document.createElement('a');
                a.download = name;
                a.href = window.URL.createObjectURL(blob);
                a.dataset.downloadurl = ['application/octet-stream', a.download, a.href].join(':');
                e.initMouseEvent('click', true, false, window, 0, 0, 0, 0, 0, false, false, false, false, 0, null);
                a.dispatchEvent(e);
            }

            async function upload_data() {
                return new Promise((res, rej) => {
                    var i = document.createElement('input');
                    i.type = 'file';
                    i.addEventListener('change', () => {
                        var file = i.files[0];
                        var reader = new FileReader();
                        reader.onload = (e) => {
                            return res(e.target.result)
                        };
                        reader.readAsArrayBuffer(file);
                    });
                    i.click(); //can not open without user click
                });
            }

            function get_cookie(name) {
                var cookie = document.cookie.split(";").find((item) => item.trim().startsWith(name + "="));
                if(!cookie) return "";
                return decodeURIComponent(cookie.split("=").slice(1).join("="));
            }

            const ONSYURI_DEBUG_ENABLED = new URLSearchParams(window.location.search).has("debug");
            function onsyuri_debug(level, args) {
                if(!ONSYURI_DEBUG_ENABLED) return;
                var line = `[${new Date().toISOString()}] ${level} ` + Array.from(args).map((arg) => {
                    if(arg instanceof Error) return arg.stack || arg.message;
                    if(typeof arg === "string") return arg;
                    try { return JSON.stringify(arg); }
                    catch { return String(arg); }
                }).join(" ");
                window.__onsyuri_debug_lines = window.__onsyuri_debug_lines || [];
                window.__onsyuri_debug_lines.push(line);
                var node = document.getElementById("onsyuri_debug_log");
                if(node) node.textContent = window.__onsyuri_debug_lines.slice(-300).join("\n");
            }
            if(ONSYURI_DEBUG_ENABLED) {
                ["log", "warn", "error"].forEach((level) => {
                    var original = console[level].bind(console);
                    console[level] = function() {
                        onsyuri_debug(level, arguments);
                        original.apply(console, arguments);
                    };
                });
                window.addEventListener("error", (event) => {
                    onsyuri_debug("window.error", [event.message, event.filename, event.lineno, event.error]);
                });
                window.addEventListener("unhandledrejection", (event) => {
                    onsyuri_debug("unhandledrejection", [event.reason]);
                });
            }
        </script>
        
        <script type="text/javascript" src="{{ jszip_url }}"></script>
        <script type="text/javascript"> // onsyuri web function 
            function em_mkdirs(_FS, path) {
                var tmpdir="";
                var arr = path.split('/');
                for(i in arr)
                {
                    tmpdir += arr[i] +"/";
                    if(arr[i]=="") continue;
                    try{
                        _FS.mkdir(tmpdir);
                    }
                    catch{};
                }
            }

            function em_lsfiles(_FS, top) {
                var files = [];
                var paths = _FS.readdir(top);
                for(let i=0; i < paths.length; i++) {
                    paths[i] = top + "/" + paths[i];
                }
                while(paths.length > 0) {
                    path = paths.pop();
                    if(path.endsWith(".") || path.endsWith("..")) continue;
                    const stat = _FS.stat(path);
                    if (_FS.isDir(stat.mode)) {
                        let tmppaths = _FS.readdir(path);
                        for (let i=0; i<tmppaths.length; i++) {
                            paths.push(path + "/" + tmppaths[i]);
                        }
                    }
                    else if (_FS.isFile(stat.mode)) {
                        files.push(path);   
                    }
                    else if (_FS.isLink(stat.mode)) {
                        // not consider symbol link here
                    }
                }
                return files;
            }

            async function em_export_data(_FS, paths) {
                var zip = new JSZip();
                for (let i=0; i<paths.length; i++) {
                    var data = _FS.readFile(paths[i]);
                    zip.file(paths[i], data, {binary: true});
                    console.log("## onsyuri_fs: em_export", paths[i]);
                }
                return await zip.generateAsync({type : "arraybuffer"});
            }

            function em_export(_FS, paths, name="export.zip") {
                em_export_data(_FS, paths).then((data) => download_data(name, data));
            }

            async function em_import(_FS, data) {
                var zip = await JSZip.loadAsync(data);
                var writes = [];
                zip.forEach((path, obj) => {
                    if(obj.dir) {
                        em_mkdirs(_FS, path);
                    }
                    else {
                        writes.push(obj.async("arraybuffer").then((buf) => {
                            em_mkdirs(_FS, path.substring(0, path.lastIndexOf("/") + 1));
                            _FS.writeFile(path, new Uint8Array(buf));
                            console.log("## onsyuri_fs: em_import", path);
                        }));
                    }
                });
                await Promise.all(writes);
            }

            // mount --gamedir other by preload or lazyload
            function mount_game(_FS, gamedir, files, urlbase="", lazyload=false) {
                console.log("## onsyuri_fs: mount_onsgame", gamedir);
                var filemap = {}
                
                if(gamedir[gamedir.length-1] =="/" ) 
                    gamedir=gamedir.substring(0, gamedir.length-1);

                if(urlbase[urlbase.length-1] == "/")
                    urlbase=urlbase.substring(0, urlbase.length-1);

                for(i in files) {
                    var path = files[i].path;
                    var url = files[i].url;
                    var file_lazyload = files[i].lazyload;
                    var j = path.lastIndexOf("/");
                    var filename =path.substring(j+1);
                    var filedir = path.substring(0, j);
                    var basedir = gamedir + "/" + filedir;
                    if(basedir[basedir.length-1]!="/") basedir+="/";
                    if(url==undefined || url.length==0)
                    {
                        if (path[0]=="/") url = urlbase + path;
                        else url = urlbase + "/" + path;
                    }

                    // console.log(path, url, file_lazyload);
                    em_mkdirs(_FS, basedir);
                    if(file_lazyload==undefined) file_lazyload = lazyload;
                    if(file_lazyload){ // pay attension to the case sensitive!
                        var key = basedir + filename;
                        filemap[key.toLowerCase()] = {
                            url: url,
                            loaded: false,
                            mountedPath: key,
                            lookupPath: key.toLowerCase()
                        };
                        if(!filemap[path.toLowerCase()]) {
                            filemap[path.toLowerCase()] = filemap[key.toLowerCase()];
                        }
                        if(!filemap[("/" + path).toLowerCase()]) {
                            filemap[("/" + path).toLowerCase()] = filemap[key.toLowerCase()];
                        }
                    }
                    else {
                        _FS.createPreloadedFile(basedir, filename, url, true, false);
                    }
                }
                return filemap;
            }

            // mount --gamedir using BrowserFS with lazyload, 
            // deprecated as sync block sound problems
            function mount_game2(_module, gamedir, lazyindex, urlbase) {
                console.log("## onsyuri_fs: mount_onsgame2", gamedir);
                var _FS=_module.FS;
                _module.addRunDependency("onsgamefs");
                
                var brewfs =  new BrowserFS.FileSystem.MountableFileSystem();
                var xhrfs = new BrowserFS.FileSystem.XmlHttpRequest(lazyindex, urlbase);
                window.xhrfs = xhrfs;
                window.brewfs = brewfs;
                brewfs.mount('/xhrfs', xhrfs);
                BrowserFS.initialize(brewfs);
                var BREWFS = new BrowserFS.EmscriptenFS(_module.FS, _module.PATH); 
                
                em_mkdirs(_FS, gamedir);
                _FS.mount(BREWFS, {root: "/xhrfs"}, gamedir);
                _module.removeRunDependency("onsgamefs")
            }

            function sync_savefs(_FS, populate) {
                return new Promise((resolve, reject) => {
                    _FS.syncfs(populate, (err) => {
                        if(err) reject(err);
                        else resolve();
                    });
                });
            }

            async function load_remote_save(_FS, savedir, saveconfig) {
                if(!saveconfig || !saveconfig.loadUrl) return;
                var response = await fetch(saveconfig.loadUrl, {
                    cache: "no-store",
                    credentials: "same-origin"
                });
                if(response.status === 204 || response.status === 404) return;
                if(!response.ok) throw new Error("remote save load failed: " + response.status);
                await em_import(_FS, await response.arrayBuffer());
                await sync_savefs(_FS, false);
                console.log("## onsyuri_fs: remote save loaded", savedir);
            }

            async function upload_remote_save() {
                var saveconfig = g_onsyuri_index.save || {};
                if(!saveconfig.saveUrl || !g_onsyuri_module.FS) return true;
                var files = em_lsfiles(g_onsyuri_module.FS, g_onsyuri_index.savedir);
                var data = await em_export_data(g_onsyuri_module.FS, files);
                var csrfToken = saveconfig.csrfToken || get_cookie("csrftoken");
                var response = await fetch(saveconfig.saveUrl, {
                    method: "POST",
                    cache: "no-store",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/zip",
                        "X-CSRFToken": csrfToken
                    },
                    body: data
                });
                if(!response.ok) throw new Error("remote save upload failed: " + response.status);
                console.log("## onsyuri_fs: remote save uploaded", files.length);
                return true;
            }

            // mount --savedir using IDBFS
            function mount_save(_module, savedir) {
                var _FS = _module.FS;
                var _IDBFS = _module.IDBFS;
                console.log("## onsyuri_fs: mount_onssave", savedir);
                em_mkdirs(_FS, savedir);
                _FS.mount(_IDBFS, {}, savedir);
                var dependencyName = "onssavefs";
                if(_module.addRunDependency) _module.addRunDependency(dependencyName);
                _FS.syncfs(true, async (err)=>{
                    try {
                        if(err) throw err;
                        await load_remote_save(_FS, savedir, g_onsyuri_index.save);
                    }
                    catch(error) {
                        console.log(error);
                        onsyuri_debug("save-load-error", [error]);
                    }
                    finally {
                        if(_module.removeRunDependency) _module.removeRunDependency(dependencyName);
                    }
                });
            }
        </script>
        
        <script type="text/javascript"> // onsyuri C interface of val or function
            
            var g_onscripter_save_flush_promise = null;

            // flush the savedir to IDFBFS for persistence
            function flush_save() {
                if(!g_onsyuri_module.FS) return Promise.resolve(false);
                if(g_onscripter_save_flush_promise) return g_onscripter_save_flush_promise;
                g_onscripter_save_flush_promise = new Promise(function(resolve) {
                    g_onsyuri_module.FS.syncfs(false, async (err)=>{
                        if(err) {
                            console.log(err);
                            resolve(false);
                            return;
                        }
                        console.log("## onsyuri_fs: flush_save, sync finished");
                        try {
                            resolve(await upload_remote_save());
                        }
                        catch(error) {
                            console.log(error);
                            onsyuri_debug("save-upload-error", [error]);
                            resolve(false);
                        }
                    });
                }).finally(function() {
                    g_onscripter_save_flush_promise = null;
                });
                return g_onscripter_save_flush_promise;
            }

            // fetch file from the remote server, and write them to local fs
            async function fetch_file(_FS, path, filemap) {
                var lookupPath = String(path || "");
                var fnode = filemap[lookupPath] || filemap[lookupPath.toLowerCase()];
                return new Promise((res)=>{
                    if(!fnode){
                        res(0);
                    }
                    else{
                        if(fnode.loaded) {
                            if(fnode.mountedPath && fnode.mountedPath !== path) {
                                try {
                                    _FS.stat(path);
                                }
                                catch(error) {
                                    try {
                                        var cachedData = _FS.readFile(fnode.mountedPath);
                                        em_mkdirs(_FS, path.substring(0, path.lastIndexOf("/") + 1));
                                        _FS.writeFile(path, cachedData);
                                    }
                                    catch(copyError) {}
                                }
                            }
                            if(typeof mark_onscripter_lazy_file_access === "function") {
                                mark_onscripter_lazy_file_access(path, fnode.url, null);
                            }
                            res(1);
                            return;
                        }
                        fetch(fnode.url).then( (resp)=>{
                            return resp.arrayBuffer();
                        }).then((data)=>{
                            var writePaths = [path];
                            if(fnode.mountedPath && fnode.mountedPath !== path) {
                                writePaths.push(fnode.mountedPath);
                            }
                            if(fnode.lookupPath && writePaths.indexOf(fnode.lookupPath) < 0) {
                                writePaths.push(fnode.lookupPath);
                            }
                            for(var i = 0; i < writePaths.length; i++) {
                                var writePath = writePaths[i];
                                em_mkdirs(_FS, writePath.substring(0, writePath.lastIndexOf("/") + 1));
                                _FS.writeFile(writePath, new Uint8Array(data));
                            }
                            onsyuri_debug("fetch", [path, fnode.url, writePaths]);
                            fnode.loaded = true;
                            if(typeof mark_onscripter_lazy_file_access === "function") {
                                mark_onscripter_lazy_file_access(path, fnode.url, data);
                            }
                            if(typeof should_hide_onscripter_loader_for_path === "function"
                                && should_hide_onscripter_loader_for_path(path)
                                && typeof hide_onscripter_loading_indicator === "function") {
                                hide_onscripter_loading_indicator();
                            }
                            res(1);
                        }).catch((err)=>{
                            console.log("## fetch_file ${path}", err);
                            onsyuri_debug("fetch-error", [path, fnode.url, err]);

                var pattern = /(?:^|\n)\s*lsp\s+[0-9]+\s*,\s*":s\/([0-9]+)\s*,([0-9]+)[^"]*?(?:SAVE|저장|세이브)[^"]*"\s*,\s*(-?[0-9]+)\s*,\s*(-?[0-9]+)/gi;
                var candidate;
                while((candidate = pattern.exec(text)) !== null) {
                    match = candidate;
                }
                if(!match) return null;
                return {
                    x: Number(match[3]) + Math.max(1, Number(match[1]) || 24) * 2,
                    y: Number(match[4]) + Math.max(1, Number(match[2]) || 24) / 2
                };
            }

            function get_onscripter_save_menu_metrics(canvas) {
                var text = read_onscripter_text_resource("0.txt");
                var pitchY = 26;
                var saveSlotCount = 20;
                var rmenuSaveIndex = 2;
                var rmenuItemCount = 6;
                var customRmenuSavePosition = get_onscripter_custom_rmenu_save_position(text);

                var menuMatch = text.match(/(?:^|\n)\s*menusetwindow\s+([0-9]+)\s*,\s*([0-9]+)\s*,\s*([0-9]+)\s*,\s*([0-9]+)/i);
                if(menuMatch) {
                    pitchY = Number(menuMatch[2]) + Number(menuMatch[4]);
                }

                var saveNumberMatch = text.match(/(?:^|\n)\s*savenumber\s+([0-9]+)/i);
                if(saveNumberMatch) {
                    saveSlotCount = Math.max(1, Number(saveNumberMatch[1]) || saveSlotCount);
                }

                var rmenuMatch = text.match(/(?:^|\n)\s*rmenu\s+([^\r\n]+)/i);
                if(rmenuMatch) {
                    var parts = split_onscripter_command_args(rmenuMatch[1]);
                    rmenuItemCount = Math.max(1, Math.floor(parts.length / 2) || rmenuItemCount);
                    for(var i = 1; i < parts.length; i += 2) {
                        if(parts[i].replace(/\s+/g, "").toLowerCase() === "save") {
                            rmenuSaveIndex = Math.floor(i / 2) + 1;
                            break;
                        }
                    }
                }

                var width = canvas && canvas.width ? canvas.width : (g_screen_width || 800);
                var height = canvas && canvas.height ? canvas.height : (g_screen_height || 600);
                var rmenuTop = (height - rmenuItemCount * pitchY) / 2;
                var saveMenuTop = (height - (saveSlotCount + 2) * pitchY) / 2;
                var confirmTop = (height - 3 * pitchY) / 2;

                return {
                    width: width,
                    height: height,
                    pitchY: pitchY,
                    rmenuSaveX: customRmenuSavePosition ? customRmenuSavePosition.x : width * 0.5,
                    rmenuSaveY: customRmenuSavePosition ? customRmenuSavePosition.y : rmenuTop + (rmenuSaveIndex - 0.5) * pitchY,
                    slotOneY: saveMenuTop + 2.5 * pitchY,
                    confirmYesX: width * 0.4,
                    confirmYesY: confirmTop + 2.5 * pitchY,
                    rmenuSaveIndex: rmenuSaveIndex,
                    rmenuItemCount: rmenuItemCount,
                    saveSlotCount: saveSlotCount,
                    usesCustomRmenu: !!customRmenuSavePosition
                };
            }

            async function run_onscripter_save_slot_one() {
                if(g_onscripter_slot_save_status === "saving") return;
                if(!is_onscripter_canvas_ready()) {
                    g_onscripter_slot_save_status = "not-ready";
                    return;
                }

                var canvas = document.getElementById("canvas");
                if(!canvas) {
                    g_onscripter_slot_save_status = "unavailable";
                    return;
                }

                set_onscripter_auto_advance_enabled(false);
                set_onscripter_skip_enabled(false);
                resume_onscripter_audio_context();

                var metrics = get_onscripter_save_menu_metrics(canvas);
                var centerX = metrics.width * 0.5;
                var centerY = metrics.height * 0.5;
                g_onscripter_slot_save_last_path = get_onscripter_save_slot_path(1);
                g_onscripter_slot_save_status = "saving";

                // R-menu -> Save item -> slot 1 -> yes. Coordinates are logical engine pixels.
                click_onscripter_canvas_logical(centerX, centerY, 2);
                await wait_onscripter(240);
                click_onscripter_canvas_logical(metrics.rmenuSaveX, metrics.rmenuSaveY, 0);
                await wait_onscripter(320);
                click_onscripter_canvas_logical(centerX, metrics.slotOneY, 0);
                await wait_onscripter(320);
                click_onscripter_canvas_logical(metrics.confirmYesX, metrics.confirmYesY, 0);

                var saved = await wait_for_onscripter_save_slot(1, 3000);
                if(saved) {
                    var synced = await flush_save();
                    g_onscripter_slot_save_status = synced ? "saved" : "sync-error";
                }
                else {
                    g_onscripter_slot_save_status = "unavailable";
                }
            }

            function setup_onscripter_nav_reveal() {
                var body = document.body;
                var nav = document.querySelector(".ui-nav");
                if(!body || !nav) return;

                var revealZoneHeight = 56;
                var audioPanel = document.getElementById("onscripter_audio_panel");
                var rotateButton = document.getElementById("onscripter_rotate_toggle");
                var autoButton = document.getElementById("onscripter_auto_toggle");
                var skipButton = document.getElementById("onscripter_skip_toggle");
                var bottomControls = document.getElementById("onscripter_bottom_controls");
                var canvasControls = document.getElementById("onscripter_canvas_controls");
                var hideTimer = null;
                var lastPointerPosition = null;

                function clearHideTimer() {
                    if(!hideTimer) return;
                    window.clearTimeout(hideTimer);
                    hideTimer = null;
                }

                function rememberPointerPosition(event) {
                    if(!event || typeof event.clientX !== "number" || typeof event.clientY !== "number") return;
                    lastPointerPosition = {
                        x: event.clientX,
                        y: event.clientY
                    };
                }

                function isPointInRect(point, rect, padding) {
                    if(!point || !rect || !rect.width || !rect.height) return false;
                    var pad = padding || 0;
                    return point.x >= rect.left - pad
                        && point.x <= rect.right + pad
                        && point.y >= rect.top - pad
                        && point.y <= rect.bottom + pad;
                }

                function isPointerOverNav() {
                    if(!lastPointerPosition) return nav.matches(":hover");
                    return isPointInRect(lastPointerPosition, nav.getBoundingClientRect(), 0);
                }

                function shouldKeepNavVisible() {
                    return isPointerOverNav() || nav.contains(document.activeElement);
                }

                function revealNav() {
                    clearHideTimer();
                    body.classList.add("is-navbar-revealed");
                }

                function hideNav() {
                    hideTimer = null;
                    if(shouldKeepNavVisible()) return;
                    body.classList.remove("is-navbar-revealed");
                }

                function scheduleHideNav(delay) {
                    clearHideTimer();
                    hideTimer = window.setTimeout(hideNav, typeof delay === "number" ? delay : 60);
                }

                function isPointerInAudioPanel(event) {
                    if(!audioPanel || typeof event.clientX !== "number" || typeof event.clientY !== "number") return false;
                    var rect = audioPanel.getBoundingClientRect();
                    if(!rect || !rect.width || !rect.height) return false;
                    var expandedX = Math.max(16, 160 - rect.width);
                    var expandedY = Math.max(16, 160 - rect.height);
                    return event.clientX >= rect.left - expandedX - 8
                        && event.clientX <= rect.right + expandedX + 8
                        && event.clientY >= rect.top - expandedY - 8
                        && event.clientY <= rect.bottom + expandedY + 8;
                }

                function isPointerInRotateButton(event) {
                    if(!rotateButton || typeof event.clientX !== "number" || typeof event.clientY !== "number") return false;
                    var rect = rotateButton.getBoundingClientRect();
                    if(!rect || !rect.width || !rect.height) return false;
                    return event.clientX >= rect.left - 8
                        && event.clientX <= rect.right + 8
                        && event.clientY >= rect.top - 8
                        && event.clientY <= rect.bottom + 8;
                }

                function isPointerInAutoButton(event) {
                    if(!autoButton || typeof event.clientX !== "number" || typeof event.clientY !== "number") return false;
                    var rect = autoButton.getBoundingClientRect();
                    if(!rect || !rect.width || !rect.height) return false;
                    return event.clientX >= rect.left - 8
                        && event.clientX <= rect.right + 8
                        && event.clientY >= rect.top - 8
                        && event.clientY <= rect.bottom + 8;
                }

                function isPointerInSkipButton(event) {
                    if(!skipButton || typeof event.clientX !== "number" || typeof event.clientY !== "number") return false;
                    var rect = skipButton.getBoundingClientRect();
                    if(!rect || !rect.width || !rect.height) return false;
                    return event.clientX >= rect.left - 8
                        && event.clientX <= rect.right + 8
                        && event.clientY >= rect.top - 8
                        && event.clientY <= rect.bottom + 8;
                }

                function isPointerInBottomControls(event) {
                    if(!bottomControls || typeof event.clientX !== "number" || typeof event.clientY !== "number") return false;
                    var rect = bottomControls.getBoundingClientRect();
                    if(!rect || !rect.width || !rect.height) return false;
                    return event.clientX >= rect.left - 8
                        && event.clientX <= rect.right + 8
                        && event.clientY >= rect.top - 8
                        && event.clientY <= rect.bottom + 8;
                }

                function isPointerInCanvasControls(event) {
                    if(!canvasControls || typeof event.clientX !== "number" || typeof event.clientY !== "number") return false;
                    var rect = canvasControls.getBoundingClientRect();
                    if(!rect || !rect.width || !rect.height) return false;
                    return event.clientX >= rect.left - 8
                        && event.clientX <= rect.right + 8
                        && event.clientY >= rect.top - 8
                        && event.clientY <= rect.bottom + 8;
                }

                function handlePointerPosition(event) {
                    if(!event || typeof event.clientY !== "number") return;
                    rememberPointerPosition(event);
                    var target = event.target && event.target.nodeType ? event.target : null;
                    var navHeight = Math.max(nav.getBoundingClientRect().height, 0);
                    var hideBoundary = Math.max(revealZoneHeight, navHeight + 24);

                    if(isPointerInAudioPanel(event) || isPointerInRotateButton(event) || isPointerInAutoButton(event) || isPointerInSkipButton(event) || isPointerInBottomControls(event) || isPointerInCanvasControls(event)) {
                        clearHideTimer();
                        body.classList.remove("is-navbar-revealed");
                        return;
                    }

                    if(event.clientY <= revealZoneHeight || (target && nav.contains(target))) {
                        revealNav();
                        return;
                    }

                    if(event.clientY > hideBoundary) {
                        scheduleHideNav();
                    }
                }

                function handleNavMouseEnter(event) {
                    rememberPointerPosition(event);
                    revealNav();
                }

                function handleNavMouseLeave(event) {
                    rememberPointerPosition(event);
                    scheduleHideNav(20);
                }

                body.classList.add("onscripter-navbar-auto-hide");
                body.classList.remove("is-navbar-revealed");
                window.addEventListener("mousemove", handlePointerPosition, {passive: true});
                window.addEventListener("pointerdown", handlePointerPosition, {passive: true});
                window.addEventListener("touchstart", function(event) {
                    if(event.touches && event.touches[0]) handlePointerPosition(event.touches[0]);
                }, {passive: true});
                nav.addEventListener("mouseenter", handleNavMouseEnter);
                nav.addEventListener("mouseleave", handleNavMouseLeave);
                nav.addEventListener("focusin", revealNav);
                nav.addEventListener("focusout", scheduleHideNav);
            }

        <script type="text/javascript"> // onsyuri video 
            const video=document.getElementById("video");

            function videoEnded(){
                g_onsyuri_module.canvas.style.display="block";
                video.style.display="none";
                if (video.src && video.src.startsWith('blob:')) {
                    URL.revokeObjectURL(video.src);
                    video.src='';
                }
                g_onsyuri_module.wait_video=false;
            }

            function playVideo(path, click_flag, loop_flag){
                g_onsyuri_module.wait_video=true;
                const fileData = g_onsyuri_module.FS.readFile(path, {flags:'r',encoding:'binary'});
                const videoBlob = new Blob([fileData.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(videoBlob);
                video.src = videoUrl;

                g_onsyuri_module.canvas.style.display="none";
                video.style.display="block";

                video.onclick=click_flag?videoEnded:null;
                video.loop=loop_flag;

                video.play();
            }

            video.addEventListener('error', function(event) {
                console.error('The video failed to load: ', event);
                videoEnded();
            });

        </script>
