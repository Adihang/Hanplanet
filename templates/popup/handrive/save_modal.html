<div id="handrive-save-modal" class="handrive-drive-modal" hidden>
    <div class="handrive-drive-modal-backdrop site-modal-backdrop" id="handrive-save-modal-backdrop"></div>
    <div class="handrive-drive-modal-dialog site-modal-dialog" data-popup-fit-bottom role="dialog" aria-modal="true" aria-labelledby="handrive-save-modal-title">
        <div class="handrive-drive-modal-head site-modal-head">
            <h2 id="handrive-save-modal-title" class="handrive-drive-modal-title">{{ handrive_text.save_location_title }}</h2>
            {% include "popup/handrive/_popup_close_button.html" with button_id="handrive-save-close-btn" %}
        </div>
        <div class="handrive-save-location-bar">
            <div class="handrive-save-breadcrumb" id="handrive-save-breadcrumb"></div>
        </div>
        <div class="handrive-save-browser">
            <section class="handrive-save-folder-pane">
                <ul class="handrive-save-folder-list" id="handrive-save-folder-list"></ul>
            </section>
        </div>
        <div class="handrive-file-meta-grid">
            <label class="handrive-file-name-field" id="handrive-save-name-field" for="handrive-save-filename-input">
                <span class="handrive-file-meta-label handrive-file-name-label">
                    <span class="handrive-file-name-label-main">{{ handrive_text.save_filename_label_main|default:"파일명" }}</span>
                    <span class="handrive-file-name-label-sub">{{ handrive_text.save_filename_label_sub|default:"(확장자 포함)" }}</span>
                </span>
                <input type="text" id="handrive-save-filename-input" value="{{ initial_filename }}" placeholder="{{ handrive_text.save_filename_placeholder }}">
            </label>
            <label class="handrive-file-extension-field" id="handrive-save-extension-field" for="handrive-save-extension-select">
                <span class="handrive-file-meta-label">{{ handrive_text.file_extension_label }}</span>
                <div class="handrive-file-extension-controls">
                    <select id="handrive-save-extension-select" class="handrive-file-extension-select" aria-label="{{ handrive_text.file_extension_quick_label }}" data-site-custom-select="1">
                        <option value="__custom__" data-site-custom-select-option-label="{{ handrive_text.file_extension_custom_option }}" data-site-custom-select-selected-label=""></option>
                        {% for ext in handrive_file_extension_options %}
                            <option value="{{ ext }}"{% if initial_filename and ext == initial_extension %} selected{% endif %}>{{ ext }}</option>
                        {% endfor %}
                    </select>
                </div>
            </label>
        </div>
        <div class="handrive-drive-modal-actions">
            <button type="button" class="ui-btn" id="handrive-create-folder-btn">{{ handrive_text.create_folder_button }}</button>
            <div class="handrive-drive-modal-actions-right">
                <button type="button" class="ui-btn" id="handrive-save-cancel-btn">{{ handrive_text.cancel }}</button>
                <button type="button" class="ui-btn ui-btn-primary" id="handrive-save-confirm-btn">{{ handrive_text.save_confirm_button }}</button>
            </div>
        </div>
        <div class="handrive-save-loading" id="handrive-save-loading" role="status" aria-live="polite" aria-label="{{ handrive_text.save_loading }}" hidden>
            <span class="handrive-save-loading-spinner" aria-hidden="true"></span>
            <span class="handrive-save-loading-text">{{ handrive_text.save_loading }}</span>
        </div>

    </div>

    {% include "popup/handrive/folder_modal.html" %}
</div>
