<div id="handrive-sync-modal" class="handrive-save-modal handrive-sync-modal" hidden>
    <div class="handrive-save-modal-backdrop" id="handrive-sync-modal-backdrop"></div>
    <div class="handrive-save-modal-dialog handrive-sync-modal-dialog" data-popup-fit-bottom role="dialog" aria-modal="true" aria-labelledby="handrive-sync-modal-title" aria-describedby="handrive-sync-modal-description">
        <div class="handrive-save-modal-head handrive-sync-modal-head">
            <div class="handrive-sync-modal-copy">
                <h2 id="handrive-sync-modal-title" class="handrive-save-modal-title">{% include 'partials/ui_i18n.html' with key='account_sync_title' %}</h2>
                <p id="handrive-sync-modal-description" class="handrive-sync-modal-description">{% include 'partials/ui_i18n.html' with key='account_sync_description' %}</p>
            </div>
        </div>
        <div class="handrive-list-pane handrive-sync-modal-list-pane">
            <ul id="handrive-sync-list" class="handrive-list" aria-label="{% include 'partials/ui_i18n.html' with key='account_sync_title' %}"></ul>
        </div>
        <div class="handrive-save-modal-actions handrive-sync-modal-actions">
            <a
                class="handrive-icon-btn account-storage-popup-download-btn"
                href="{% if ui_lang %}{% url 'main:handrive_sync_client_download_lang' ui_lang=ui_lang %}{% else %}{% url 'main:handrive_sync_client_download' %}{% endif %}"
                download="handrive.exe"
                aria-label="{% include 'partials/ui_i18n.html' with key='account_sync_client_download' %}"
                title="{% include 'partials/ui_i18n.html' with key='account_sync_client_download' %}"
            ><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" y1="3" x2="10" y2="12.5"/><polyline points="6.5,9.5 10,13 13.5,9.5"/><path d="M4 15.5h12"/></svg></a>
            <div class="handrive-save-modal-actions-right">
                <button type="button" class="ui-btn" id="handrive-sync-cancel-btn">{% include 'partials/ui_i18n.html' with key='cancel' %}</button>
                <button type="button" class="ui-btn ui-btn-primary" id="handrive-sync-save-btn">{% include 'partials/ui_i18n.html' with key='save' %}</button>
            </div>
        </div>
    </div>
</div>
