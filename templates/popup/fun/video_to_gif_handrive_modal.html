<div class="image-color-picker-modal-backdrop" data-video-to-gif-handrive-modal hidden>
    <section class="image-color-picker-modal image-color-picker-handrive-modal" role="dialog" aria-modal="true" aria-labelledby="videoToGifHandriveTitle">
        <header class="image-color-picker-modal-head">
            <h2 class="image-color-picker-modal-title" id="videoToGifHandriveTitle">{{ handrive_modal_title }}</h2>
            <button class="image-color-picker-modal-close" type="button" data-video-to-gif-handrive-close aria-label="{{ handrive_close_label }}">×</button>
        </header>
        <div class="image-color-picker-handrive-list handrive-list-pane handrive-sync-modal-list-pane">
            <ul class="handrive-list" data-video-to-gif-handrive-list role="list" aria-label="{{ handrive_modal_title }}"></ul>
        </div>
        <p class="image-color-picker-handrive-status" data-video-to-gif-handrive-status role="status" aria-live="polite"></p>
    </section>
</div>
