<div id="{{ modal_id }}" class="handrive-help-modal" hidden>
    <div class="handrive-help-modal-backdrop site-modal-backdrop" id="{{ backdrop_id }}"></div>
    <div class="handrive-help-modal-dialog site-modal-dialog" data-popup-fit-bottom role="dialog" aria-modal="true" aria-labelledby="{{ modal_id }}-title">
        <header class="handrive-help-modal-head site-modal-head">
            <h2 id="{{ modal_id }}-title" class="handrive-popup-title handrive-help-modal-title">{{ aria_label }}</h2>
            {% include "popup/handrive/_popup_close_button.html" with button_id=close_button_id click_target_id=close_click_target_id %}
        </header>
        <div class="handrive-help-modal-body">
            {% if article_id %}
            <article class="ui-markdown handrive-help-markdown" id="{{ article_id }}">{{ article_html|default:'' }}</article>
            {% else %}
            <article class="ui-markdown handrive-help-markdown">{{ article_html|default:'' }}</article>
            {% endif %}
        </div>
        {% if resizable_modal %}
        <div class="handrive-preview-resize-handle handrive-preview-resize-handle-n" data-preview-modal-resize-handle="n" aria-hidden="true"></div>
        <div class="handrive-preview-resize-handle handrive-preview-resize-handle-ne" data-preview-modal-resize-handle="ne" aria-hidden="true"></div>
        <div class="handrive-preview-resize-handle handrive-preview-resize-handle-e" data-preview-modal-resize-handle="e" aria-hidden="true"></div>
        <div class="handrive-preview-resize-handle handrive-preview-resize-handle-se" data-preview-modal-resize-handle="se" aria-hidden="true"></div>
        <div class="handrive-preview-resize-handle handrive-preview-resize-handle-s" data-preview-modal-resize-handle="s" aria-hidden="true"></div>
        <div class="handrive-preview-resize-handle handrive-preview-resize-handle-sw" data-preview-modal-resize-handle="sw" aria-hidden="true"></div>
        <div class="handrive-preview-resize-handle handrive-preview-resize-handle-w" data-preview-modal-resize-handle="w" aria-hidden="true"></div>
        <div class="handrive-preview-resize-handle handrive-preview-resize-handle-nw" data-preview-modal-resize-handle="nw" aria-hidden="true"></div>
        {% endif %}
    </div>
</div>
