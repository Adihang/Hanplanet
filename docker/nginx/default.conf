server {
    listen 80;
    server_name mc.hanplanet.com;

    client_max_body_size 100m;
    access_log /var/log/nginx/access_json.log access_json;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, s-maxage=2592000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=2592000, immutable" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=2592000, immutable" always;
    }

    location /media/ {
        alias /data/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /status.json {
        proxy_pass http://$django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_x_forwarded_proto;
    }

    location = /bluemap {
        return 301 https://$host/map/;
    }

    location = /bluemap/ {
        return 301 https://$host/map/;
    }

    location = /map {
        return 301 https://$host/map/;
    }

    location ~ ^/map/(?:maps-v20260623-0630|maps)/[^/]+/assets/playerheads/[^/]+\.png$ {
        rewrite ^/map/maps-v20260623-0630/(.*)$ /maps/$1 break;
        rewrite ^/map/maps/(.*)$ /maps/$1 break;
        proxy_pass http://host.docker.internal:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_x_forwarded_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_intercept_errors on;
        error_page 404 = @bluemap_playerhead_fallback;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, s-maxage=300";
    }

    location @bluemap_playerhead_fallback {
        rewrite ^ /assets/steve.png break;
        proxy_pass http://host.docker.internal:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, s-maxage=300";
    }

    location /map/maps-v20260623-0630/ {
        proxy_pass http://host.docker.internal:8100/maps/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_x_forwarded_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=60, s-maxage=60";
    }

    location /map/maps/ {
        proxy_pass http://host.docker.internal:8100/maps/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_x_forwarded_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=60, s-maxage=60";
    }

    location /map/ {
        proxy_pass http://host.docker.internal:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_x_forwarded_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://$django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_x_forwarded_proto;
    }
}
