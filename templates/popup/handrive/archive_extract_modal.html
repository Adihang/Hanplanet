<div id="handrive-archive-extract-modal" class="handrive-popup-modal" hidden>
    <div class="handrive-popup-modal-backdrop" id="handrive-archive-extract-modal-backdrop"></div>
    <div class="handrive-popup-modal-dialog" data-popup-fit-bottom role="dialog" aria-modal="true" aria-labelledby="handrive-archive-extract-title">
        <h2 id="handrive-archive-extract-title" class="handrive-popup-title">{{ handrive_text.archive_extract_title }}</h2>
        <div class="handrive-popup-target" id="handrive-archive-extract-target"></div>
        <p class="handrive-popup-message">{{ handrive_text.archive_extract_message }}</p>
        <div class="handrive-popup-actions">
            <button type="button" class="ui-btn" id="handrive-archive-extract-cancel-btn">{{ handrive_text.cancel }}</button>
            <button type="button" class="ui-btn" id="handrive-archive-extract-current-btn">{{ handrive_text.archive_extract_current_folder }}</button>
            <button type="button" class="ui-btn ui-btn-primary" id="handrive-archive-extract-folder-btn">{{ handrive_text.archive_extract_named_folder }}</button>
        </div>
    </div>
</div>
