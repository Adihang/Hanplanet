<div id="handrive-url-share-modal" class="handrive-popup-modal" hidden>
    <div class="handrive-popup-modal-backdrop site-modal-backdrop" id="handrive-url-share-modal-backdrop"></div>
    <div class="handrive-popup-modal-dialog site-modal-dialog" data-popup-fit-bottom role="dialog" aria-modal="true" aria-labelledby="handrive-url-share-title">
        <header class="handrive-popup-head site-modal-head">
            <div class="handrive-url-share-title-row">
                <label
                    class="handrive-url-share-enabled-switch"
                    id="handrive-url-share-enabled-toggle"
                    title="{{ handrive_text.url_share_enabled_label }}"
                >
                    <h2 id="handrive-url-share-title" class="handrive-popup-title">{{ handrive_text.url_share_title }}</h2>
                    <input
                        type="checkbox"
                        id="handrive-url-share-enabled-checkbox"
                        aria-label="{{ handrive_text.url_share_enabled_label }}"
                    >
                    <span class="handrive-url-share-switch-knob" aria-hidden="true"></span>
                </label>
            </div>
            {% include "popup/handrive/_popup_close_button.html" with button_id="handrive-url-share-close-btn" %}
        </header>
        <div class="handrive-url-share-link-group" hidden>
            <div class="handrive-url-share-link-content">
                <div class="handrive-url-share-targets" id="handrive-url-share-targets" hidden>
                    <p class="handrive-url-share-target-empty">{{ handrive_text.url_share_targets_empty_label }}</p>
                    <input
                        type="text"
                        id="handrive-url-share-target-input"
                        autocomplete="off"
                        spellcheck="false"
                        aria-label="{{ handrive_text.url_share_targets_placeholder }}"
                        placeholder="{{ handrive_text.url_share_targets_placeholder }}"
                    >
                    <div class="handrive-url-share-target-list" id="handrive-url-share-target-list" aria-live="polite"></div>
                </div>
                <div id="handrive-url-share-url-row" class="handrive-field handrive-field-full" hidden>
                    <div class="handrive-url-share-read-head">
                        <span id="handrive-url-share-read-label">{{ handrive_text.url_share_label }}</span>
                        <label class="handrive-url-share-edit-switch" id="handrive-url-share-edit-toggle">
                            <span>{{ handrive_text.url_share_edit_label }}</span>
                            <input
                                type="checkbox"
                                id="handrive-url-share-edit-checkbox"
                                aria-label="{{ handrive_text.url_share_edit_label }}"
                            >
                            <span class="handrive-url-share-switch-knob" aria-hidden="true"></span>
                        </label>
                    </div>
                    <div class="handrive-url-share-input-wrap handrive-inline-copy-field">
                        <input type="text" id="handrive-url-share-input" readonly>
                        <button
                            type="button"
                            class="handrive-url-share-inline-copy-btn handrive-inline-copy-action"
                            id="handrive-url-share-copy-url-icon-btn"
                            aria-label="{{ handrive_text.url_share_copy_button }}"
                            title="{{ handrive_text.url_share_copy_button }}"
                        ><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="6" width="9" height="11" rx="1.5"/><path d="M4 13V4.5C4 3.7 4.7 3 5.5 3H13"/></svg></button>
                    </div>
                </div>
            </div>
        </div>
        <div id="handrive-url-share-download-row" class="handrive-field handrive-field-full" hidden>
            <span>{{ handrive_text.url_share_download_label }}</span>
            <div class="handrive-url-share-input-wrap handrive-inline-copy-field">
                <input type="text" id="handrive-url-share-download-input" readonly>
                <button
                    type="button"
                    class="handrive-url-share-inline-copy-btn handrive-inline-copy-action"
                    id="handrive-url-share-copy-download-icon-btn"
                    aria-label="{{ handrive_text.url_share_copy_download_button }}"
                    title="{{ handrive_text.url_share_copy_download_button }}"
                ><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="6" width="9" height="11" rx="1.5"/><path d="M4 13V4.5C4 3.7 4.7 3 5.5 3H13"/></svg></button>
            </div>
        </div>
    </div>
</div>
