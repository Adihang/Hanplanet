name: MinecraftStatusBridge
version: 1.6.0
main: dev.minecraftstatus.bridge.MinecraftStatusBridgePlugin
api-version: "26.2"
description: Writes Minecraft server status JSON and exposes trusted player-state admin commands.
commands:
  minecraftstatus:
    description: Modify Minecraft player status from trusted admin tooling.
    usage: /minecraftstatus set <player> <health|food|level|exp|gamemode|location|effects|inventory> <value>
    permission: minecraftstatus.admin
permissions:
  minecraftstatus.admin:
    description: Allows modifying player state through status tooling.
    default: op
