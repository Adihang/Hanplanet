<div id="handrive-folder-icon-modal" class="handrive-popup-modal" hidden>
    <div class="handrive-popup-modal-backdrop site-modal-backdrop" id="handrive-folder-icon-modal-backdrop"></div>
    <div class="handrive-popup-modal-dialog handrive-folder-icon-modal-dialog site-modal-dialog" data-popup-fit-bottom role="dialog" aria-modal="true" aria-labelledby="handrive-folder-icon-modal-title">
        <header class="handrive-popup-head site-modal-head">
            <h2 id="handrive-folder-icon-modal-title" class="handrive-popup-title">{{ handrive_text.folder_icon_title }}</h2>
            {% include "popup/handrive/_popup_close_button.html" with click_target_id="handrive-folder-icon-cancel-btn" %}
        </header>
        <div class="handrive-popup-target" id="handrive-folder-icon-target"></div>
        <div class="handrive-folder-icon-preview-wrap" id="handrive-folder-icon-preview-wrap" hidden>
            <img class="handrive-folder-icon-preview-img" id="handrive-folder-icon-preview-img" src="" alt="">
        </div>
        <div class="handrive-field handrive-field-full handrive-folder-icon-file-field">
            <span class="handrive-field-label">{{ handrive_text.folder_icon_file_label }}</span>
            <input class="handrive-folder-icon-file-input" type="file" id="handrive-folder-icon-file-input" accept="image/*" aria-describedby="handrive-folder-icon-file-name">
            <span class="handrive-folder-icon-file-control">
                <button type="button" class="handrive-folder-icon-file-button" id="handrive-folder-icon-file-button">{{ handrive_text.folder_icon_file_button }}</button>
                <span class="handrive-folder-icon-file-name" id="handrive-folder-icon-file-name" data-empty-label="{{ handrive_text.folder_icon_file_empty }}">{{ handrive_text.folder_icon_file_empty }}</span>
            </span>
        </div>
        <div class="handrive-popup-actions">
            <button type="button" class="ui-btn handrive-folder-icon-delete-btn" id="handrive-folder-icon-delete-btn" hidden>{{ handrive_text.folder_icon_delete_button }}</button>
            <button type="button" class="ui-btn" id="handrive-folder-icon-cancel-btn">{{ handrive_text.cancel }}</button>
            <button type="button" class="ui-btn ui-btn-primary" id="handrive-folder-icon-confirm-btn">{{ handrive_text.save_button }}</button>
        </div>
    </div>
</div>
