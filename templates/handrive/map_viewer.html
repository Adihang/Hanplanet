{% extends 'base.html' %}
{% block body_class %}handrive-page map-viewer-page{% endblock %}
{% block content %}
{% include 'handrive/_assets_head.html' %}

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">

<style>
.map-viewer-wrap {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: var(--handrive-bg, #f5f5f5);
}
.map-viewer-toolbar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 20px 12px 10px;
    background: var(--handrive-surface, #fff);
    border-bottom: 1px solid var(--handrive-border, #e0e0e0);
    flex-shrink: 0;
}
.map-viewer-toolbar-title {
    font-weight: 600;
    font-size: 24px;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 6px;
    color: var(--handrive-text, #222);
}
#map-viewer-container {
    flex: 1;
    overflow: hidden;
    position: relative;
}
.map-loading-overlay {
    position: absolute;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--handrive-bg, #f5f5f5);
}
.map-loading-overlay.is-hidden {
    display: none;
}
/* 구역 레이블 */
.map-zone-label {
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: none;
    box-shadow: none;
    border-radius: 4px;
    font-size: 1.17em;
    padding: 2px 6px;
    white-space: nowrap;
    pointer-events: none;
}
.map-zone-label::before { display: none; }
.map-marker-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6em;
    line-height: 1;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
}
/* 마커 팝업 */
.leaflet-popup-content-wrapper {
    border-radius: 8px;
    font-size: 0.88em;
}
body.theme-dark .leaflet-popup-content-wrapper,
body.theme-dark .leaflet-popup-tip {
    background: var(--handrive-surface);
    color: var(--handrive-text);
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
}
body.theme-dark .leaflet-container {
    background: #1a1a1a;
}
</style>

<div class="map-viewer-wrap">
    <div class="map-viewer-toolbar">
        <span class="map-viewer-toolbar-title" title="{{ map_name }}">{{ map_name }}</span>
        {% if can_edit %}
        <a href="{{ map_editor_url }}" class="handrive-icon-btn" title="편집" aria-label="편집"
        ><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 17l1-4L13 3l3 3L7 16l-4 1z"/><line x1="11" y1="5" x2="14" y2="8"/><line x1="4" y1="13" x2="7" y2="16"/></svg></a>
        {% endif %}
        <a href="{{ handrive_list_url }}" class="handrive-icon-btn" title="목록으로" aria-label="목록으로"
        ><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="5" x2="17" y2="5"/><line x1="3" y1="10" x2="17" y2="10"/><line x1="3" y1="15" x2="17" y2="15"/></svg></a>
    </div>
    <div id="map-viewer-container"
        data-map-path="{{ map_path }}"
        data-image-url="{{ image_url }}"
        data-map-data-api="{{ map_data_api_url }}"
        data-map-icon-api="{{ map_icon_api_url }}"
    >
        <div class="map-loading-overlay" id="map-viewer-loading">
            <div class="handrive-list-loading-spinner"></div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
(function () {
    "use strict";

    var container = document.getElementById("map-viewer-container");
    var mapPath = container.dataset.mapPath;
    var imageUrl = container.dataset.imageUrl;
    var mapDataApi = container.dataset.mapDataApi;

    var imgWidth = 1000, imgHeight = 700;
    var loadedImageUrl = imageUrl || "";

    function hideLoading() {
        var overlay = document.getElementById("map-viewer-loading");
        if (overlay) { overlay.classList.add("is-hidden"); }
    }

    function loadImageWithProgress(url, onLoad, onError) {
        if (!url) { onLoad(url); return; }
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.responseType = "blob";
        xhr.onload = function() {
            if (xhr.status >= 200 && xhr.status < 300) {
                var blobUrl = URL.createObjectURL(xhr.response);
                var img = new Image();
                img.onload = function() {
                    imgWidth = img.naturalWidth;
                    imgHeight = img.naturalHeight;
                    onLoad(blobUrl);
                };
                img.onerror = function() { onLoad(blobUrl); };
                img.src = blobUrl;
            } else {
                onError();
            }
        };
        xhr.onerror = function() { onError(); };
        xhr.send();
    }

    loadImageWithProgress(
        imageUrl,
        function(blobUrl) { loadedImageUrl = blobUrl; initMap(); },
        function() { initMap(); }
    );

    function initMap() {
        hideLoading();
        var map = L.map("map-viewer-container", {
            crs: L.CRS.Simple,
            minZoom: -4,
            maxZoom: 4,
            zoomSnap: 0.25,
            attributionControl: false,
            scrollWheelZoom: false,
        });

        map.getContainer().addEventListener("wheel", function(e) {
            if (e.ctrlKey || e.metaKey) {
                e.preventDefault();
                map.setZoom(map.getZoom() + (e.deltaY > 0 ? -0.5 : 0.5));
            }
        }, { passive: false });

        var bounds = [[0, 0], [imgHeight, imgWidth]];
        if (loadedImageUrl) {
            L.imageOverlay(loadedImageUrl, bounds).addTo(map);
        }
        map.fitBounds(bounds);

        // GeoJSON 로드
        fetch(mapDataApi + "?path=" + encodeURIComponent(mapPath), {
            headers: { "X-Requested-With": "XMLHttpRequest" }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (!data.ok || !data.geojson) return;
            var features = data.geojson.features || [];
            features.forEach(function(f) {
                if (!f.geometry || !f.properties) return;
                var props = f.properties;

                if (f.geometry.type === "Polygon" && props.type === "zone") {
                    var coords = (f.geometry.coordinates[0] || []).map(function(c) { return [c[1], c[0]]; });
                    if (coords.length > 1) coords.pop();
                    var color = props.color || "#4f8ef7";
                    var layer = L.polygon(coords, { color: color, fillColor: color, fillOpacity: 0.15, weight: 2 }).addTo(map);
                    if (props.name) {
                        var centroid = computeCentroid(layer.getLatLngs()[0]);
                        L.tooltip({ permanent: true, direction: "center", className: "map-zone-label" })
                            .setContent(props.name)
                            .setLatLng(centroid)
                            .addTo(map);
                    }
                } else if (f.geometry.type === "Point" && props.type === "marker") {
                    var c = f.geometry.coordinates;
                    var latlng = L.latLng(c[1], c[0]);
                    var icon = createIcon(props.emoji, props.iconUrl);
                    var marker = L.marker(latlng, { icon: icon }).addTo(map);
                    if (props.name || props.group) {
                        var popupLines = [];
                        if (props.name) popupLines.push("<b>" + escHtml(props.name) + "</b>");
                        if (props.group) popupLines.push("<span style='color:#888;font-size:0.9em;'>" + escHtml(props.group) + "</span>");
                        marker.bindPopup(popupLines.join("<br>"), { maxWidth: 200 });
                    }
                }
            });
        })
        .catch(function() {});
    }

    function computeCentroid(latlngs) {
        var lat = 0, lng = 0;
        latlngs.forEach(function(ll) { lat += ll.lat; lng += ll.lng; });
        return L.latLng(lat / latlngs.length, lng / latlngs.length);
    }

    function createIcon(emoji, iconUrl) {
        var html;
        if (iconUrl) {
            html = '<div class="map-marker-icon"><img src="' + escHtml(iconUrl) + '" style="width:28px;height:28px;object-fit:contain;"></div>';
        } else {
            html = '<div class="map-marker-icon">' + escHtml(emoji || "📍") + '</div>';
        }
        return L.divIcon({ html: html, className: "", iconSize: [32, 32], iconAnchor: [16, 20] });
    }

    function escHtml(str) {
        return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
})();
</script>
{% endblock %}
