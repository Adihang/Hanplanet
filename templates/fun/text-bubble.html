{% load static static_versioned %}
<!doctype html>
<html lang="{{ ui_lang|default:'ko' }}">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{{ page_description }}">
    <meta name="author" content="Hanplanet">
    <meta name="robots" content="noindex">
    {% include "partials/pwa.html" %}
    {% include "partials/static_script_fallback.html" %}
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="{% static 'icons/pwa-192.png' %}">
    <link rel="stylesheet" type="text/css" href="{% static_v 'css/common/style.css' %}">
    <script src="{% static_v 'js/common/site.js' %}" type="text/javascript" defer onerror="window.__reloadStaticScript(this)"></script>
    <title>{{ page_title }} | Hanplanet</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: rgb(248, 245, 238);
        }

        #textBubbleCanvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .tb-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
            border-bottom: 1px solid rgba(0, 0, 0, 0.10);
            background: rgba(248, 245, 238, 0.82);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .tb-logo {
            font-family: "Times New Roman", Times, Georgia, serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #111;
            user-select: none;
        }

        .tb-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tb-loading {
            font-family: Georgia, serif;
            font-size: 13px;
            color: #888;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .tb-refresh {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background: transparent;
            color: #444;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.15s, transform 0.2s;
            user-select: none;
        }

        .tb-refresh:hover {
            background: rgba(0, 0, 0, 0.06);
            transform: rotate(30deg);
        }

        .tb-refresh:active {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <canvas id="textBubbleCanvas"></canvas>

    <div class="tb-header">
        <span class="tb-logo">The New York Times</span>
        <div class="tb-header-right">
            <span class="tb-loading" id="tbLoading">Loading…</span>
            <button class="tb-refresh" id="tbRefresh" title="New article" aria-label="Fetch new article">↻</button>
        </div>
    </div>

    <script type="module" src="{% static_v 'js/fun/text_bubble/page.js' %}"></script>
</body>
</html>
