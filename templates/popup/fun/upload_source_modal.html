<div class="media-tool-modal-backdrop site-modal-backdrop" data-upload-source-modal hidden>
    <section class="media-tool-modal media-upload-source-modal site-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="uploadSourceModalTitle">
        <header class="media-tool-modal-head site-modal-head">
            <h2 class="media-tool-modal-title" id="uploadSourceModalTitle">{{ upload_source_modal_title }}</h2>
            {% include "popup/handrive/_popup_close_button.html" with close_label=handrive_close_label upload_source_close=True %}
        </header>
        <div class="media-upload-source-options">
            <button class="media-upload-source-option" type="button" data-upload-source-local>
                <span class="media-upload-source-option-icon">L</span>
                <span class="media-upload-source-option-label">{{ upload_source_local_label }}</span>
            </button>
            {% if handrive_picker_enabled %}
                <button class="media-upload-source-option" type="button" data-upload-source-handrive>
                    <span class="media-upload-source-option-icon">H</span>
                    <span class="media-upload-source-option-label">{{ upload_source_handrive_label }}</span>
                </button>
            {% endif %}
        </div>
    </section>
</div>
